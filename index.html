<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 // Secure Flasher</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#070b09;
    font-family:monospace;
    overflow:hidden;
    color:#00ff9d;
}

/* SPLASH */
#splash{
    position:fixed;
    inset:0;
    background:#070b09;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
    transition:0.5s;
}
#splash h1{
    font-size:2.8rem;
    letter-spacing:5px;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}

/* TERMINAL */
#wrapper{
    position:fixed;
    inset:0;
    padding:40px;
}
#term{
    width:100%;
    height:100%;
    background:#000000ee;
    border:1px solid #00ff9d55;
    box-shadow:0 0 40px #00ff9d22;
}

/* BUTTONS */
#buttons{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:none;
}

.cleanBtn{
    background:transparent !important;
    color:#00ff9d !important;
    border:1px solid #00ff9d !important;
    padding:12px 30px !important;
    font-size:14px !important;
    letter-spacing:2px;
    cursor:pointer !important;
    margin:5px;
    transition:0.3s;
}
.cleanBtn:hover{
    background:#003b2a !important;
}

/* SUCCESS */
#successScreen{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:20;
    text-align:center;
}
#successScreen h2{
    font-size:2rem;
    letter-spacing:4px;
}
#successScreen button{
    margin-top:20px;
    padding:10px 20px;
    border:1px solid #00ff9d;
    background:transparent;
    color:#00ff9d;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to initialize flashing system</p>
</div>

<div id="wrapper">
    <div id="term"></div>
</div>

<div id="buttons">

    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-C5</button>
    </esp-web-install-button>

    <esp-web-install-button manifest="manifest_c3.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-C3</button>
    </esp-web-install-button>

    <esp-web-install-button manifest="manifest_s3.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-S3</button>
    </esp-web-install-button>

</div>

<div id="successScreen">
    <h2>FLASH COMPLETE</h2>
    <p>Device programmed successfully</p>
    <button onclick="location.reload()">FLASH ANOTHER</button>
</div>

<script>

/* TERMINAL */
const term = new Terminal({
    theme:{
        background:'transparent',
        foreground:'#00ff9d',
        cursor:'#00ff9d'
    },
    fontSize:15,
    cursorBlink:true
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(text, delay=25){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

/* INTRO */
function enter(){
    document.getElementById("splash").classList.add("fade");

    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.4;
    intro.play().catch(()=>{});

    setTimeout(startSequence,500);
}

async function startSequence(){
    await type("Initializing secure flashing environment...");
    await sleep(300);
    await type("Checking firmware integrity...");
    await sleep(300);
    await type("System ready.");
    await sleep(300);
    await type("Select device firmware to begin.");
    document.getElementById("buttons").style.display="block";
}

/* PROGRESS VIA STATE-CHANGE */
document.querySelectorAll("esp-web-install-button")
.forEach(btn => {

    btn.addEventListener("state-change", (e) => {

        if (e.detail.state === "INSTALLING") {
            term.writeln("\n> Flashing started...");
        }

        if (typeof e.detail.progress === "number") {
            const percent = Math.round(e.detail.progress * 100);
            term.writeln(`\x1b[1;32m[ ${percent}% ]\x1b[0m`);
        }

        if (e.detail.state === "SUCCESS") {
            term.writeln("\n✓ FLASH SUCCESSFUL");
            setTimeout(()=>{
                document.getElementById("successScreen").style.display="flex";
            },600);
        }

        if (e.detail.state === "ERROR") {
            term.writeln("\n✗ ERROR: " + e.detail.error);
        }

    });

});

</script>

</body>
</html>
