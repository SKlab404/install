<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARAUDER V37 (INVERTED)</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        
        #header { padding: 20px; background: #050505; border-bottom: 2px solid #003300; text-align: center; }
        
        /* Estilo dos Botões Iniciais */
        esp-web-install-button button {
            padding: 15px 30px !important; 
            background: #002200 !important; color: #0f0 !important; border: 1px solid #0f0 !important; 
            font-family: monospace !important; font-weight: bold !important; cursor: pointer !important;
        }

        #term-container { flex: 1; padding: 20px; background: #000; border-top: 1px solid #111; }

        /* O HACK DO INVERT: Aplica-se à caixa de diálogo quando ela aparece */
        ewt-install-dialog {
            filter: invert(0.92) hue-rotate(180deg) !important;
            background-color: #fff !important; /* Invertido fica preto */
        }
    </style>
</head>
<body>

    <div id="header">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">FLASH STD</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:#f00 !important; color:#f00 !important;">FLASH BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="term-container"></div>

    <script>
        // TERMINAL
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0', cursor: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term-container'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V37 (DARK MODE FORÇADO) ===');
        term.writeln('> O popup vai aparecer com cores invertidas.');

        // LOGS
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args);
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        // EVENTOS DE ESTADO
        document.querySelectorAll('esp-web-install-button').forEach(btn => {
            btn.addEventListener('state-change', (ev) => {
                if (ev.detail.state === 'SUCCESS') term.writeln('\n✅ INSTALAÇÃO COMPLETA!');
                if (ev.detail.state === 'ERROR') term.writeln('\n❌ ERRO.');
            });
        });

    </script>
</body>
</html>
