<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:black;
    font-family:monospace;
    color:#00ff00;
    overflow:hidden;
}

/* SPLASH */
#splash{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
    transition:1s;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}
#splash h1{
    font-size:4em;
    text-shadow:0 0 30px #00ff00;
}

/* TERMINAL */
#term{
    position:fixed;
    width:100%;
    height:100%;
    z-index:1;
}

/* BOTÃO */
#flashArea{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:none;
}

.cyberBtn{
    background:#002200 !important;
    color:#00ff00 !important;
    border:2px solid #00ff00 !important;
    padding:15px 40px !important;
    font-size:16px !important;
    cursor:pointer !important;
    box-shadow:0 0 15px #00ff00 !important;
}
</style>
</head>
<body>

<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to initialize system...</p>
</div>

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cyberBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(text, delay=40){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

function enter(){

    document.getElementById("splash").classList.add("fade");

    // ⚠️ COLOCA AQUI O LINK RAW CORRETO DO MP3
    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.6;
    intro.play().catch(()=>{});

    setTimeout(startSequence, 800);
}

async function startSequence(){

    await type("Establishing secure connection...");
    await sleep(600);

    await type("Decrypting environment...");
    await sleep(600);

    await type("Loading kernel modules...");
    await sleep(600);

    term.write("\r\n");
    await type("Are you there?");
    await sleep(1200);

    await type("...");

    await sleep(1000);
    await type("Connection established.");
    await sleep(500);

    term.write("\r\n");
    await type("System ready.");
    await sleep(500);

    term.write("\r\n");
    term.writeln("\x1b[1;33mAuthorization required.\x1b[0m");

    document.getElementById("flashArea").style.display = "block";
}

/* PROGRESSO REAL */
const originalConsoleLog = console.log;
console.log = function (...args) {
    const msg = args.join(" ");
    if (msg.includes("Writing") || msg.includes("%") || msg.includes("Erasing")) {
        term.writeln("> " + msg);
    }
    originalConsoleLog.apply(console, args);
};

document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("> Flashing firmware...");
    }
    if(e.detail.state==="SUCCESS"){
        term.writeln("\x1b[1;32m✓ Flash complete\x1b[0m");
    }
    if(e.detail.state==="ERROR"){
        term.writeln("\x1b[1;31m✗ "+e.detail.error+"\x1b[0m");
    }
});

</script>

</body>
</html>
