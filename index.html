<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V44 - ULTIMATE BOOT</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #00ff41; 
            font-family: 'Orbitron', monospace; 
            overflow: hidden;
            height: 100vh;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; }
        
        #main { 
            position: relative; z-index: 10; 
            display: flex; flex-direction: column; 
            height: 100vh; opacity: 0; transition: opacity 2s;
        }

        /* SCANLINES */
        #main::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg, 
                transparent, 
                transparent 2px, 
                rgba(0,255,65,0.03) 2px, 
                rgba(0,255,65,0.03) 4px
            );
            pointer-events: none;
            z-index: 15;
        }

        #boot-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 20;
            font-size: 3em; text-align: center;
            text-shadow: 0 0 50px #00ff41;
        }

        .boot-text { opacity: 0; animation: bootPulse 0.5s forwards; }
        .boot-text:nth-child(1) { animation-delay: 0.5s; }
        .boot-text:nth-child(2) { animation-delay: 1.5s; }
        .boot-text:nth-child(3) { animation-delay: 2.5s; }
        @keyframes bootPulse {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        #header { 
            padding: 30px; 
            text-align: center; 
            background: linear-gradient(45deg, #001100, #003300);
            border-bottom: 3px solid #00ff41;
            text-shadow: 0 0 20px #00ff41;
        }
        
        h1 { 
            font-size: 2.5em; 
            margin: 0; 
            letter-spacing: 5px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        /* resto igual ao V43 */
        #controls { padding: 40px; text-align: center; background: rgba(0,20,0,0.9); backdrop-filter: blur(10px); }
        esp-web-install-button button {
            background: linear-gradient(45deg, #00aa00, #00ff41) !important; 
            color: #000 !important; border: 2px solid #00ff41 !important; 
            padding: 20px 40px !important; font-size: 1.2em; font-weight: 900 !important; 
            cursor: pointer !important; font-family: 'Orbitron', monospace !important; 
            text-transform: uppercase !important; border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,255,65,0.5); transition: all 0.3s;
        }
        esp-web-install-button button:hover { 
            box-shadow: 0 0 50px #00ff41, inset 0 0 20px rgba(0,0,0,0.3);
            transform: scale(1.05);
        }
        #term { flex: 1; padding: 20px; background: rgba(0,0,0,0.95); border-top: 1px solid #00ff41; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <!-- BOOT SCREEN ESPECTACULAR -->
    <div id="boot-screen">
        <div class="boot-text">INITIALIZING...</div>
        <div class="boot-text">MAR4UD3R V44</div>
        <div class="boot-text">MATRIX ONLINE</div>
    </div>

    <div id="main">
        <div id="header">
            <h1>MARAUDER V44</h1>
            <div style="font-size: 1.2em; margin-top: 10px;">ULTIMATE BOOT SEQUENCE</div>
        </div>

        <div id="controls">
            <esp-web-install-button manifest="manifest_c5.json">
                <button slot="activate">🧠 FLASH C5</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_std.json">
                <button slot="activate">⚡ FLASH STD</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_bruce.json">
                <button slot="activate" style="background: linear-gradient(45deg, #ff0000, #ff4444) !important; border-color: #ff4444 !important;">🔥 FLASH BRUCE</button>
            </esp-web-install-button>
        </div>

        <div id="term"></div>
    </div>

    <script>
        // SOM DE BOOT (base64 audio)
        const bootSound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo');
        
        // MATRIX RAIN (acelerado no boot)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = 'MAR4UDERPTCYBERHACKESP32FIREWIFI123🔥⚡🧠💀';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let matrixSpeed = 20; // Rápido no início

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = `${fontSize}px monospace`;
            
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }

        // BOOT SEQUENCE
        bootSound.play().catch(() => {}); // Som de boot
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            document.getElementById('boot-screen').style.transition = 'opacity 2s';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('main').style.opacity = '1';
                matrixSpeed = 50; // Chuva normal
            }, 2000);
        }, 3500);

        setInterval(draw, matrixSpeed);

        // TERMINAL + EVENTOS (igual às versões anteriores)
        const term = new Terminal({ 
            theme: { background: 'rgba(0,0,0,0.8)', foreground: '#00ff41', cursor: '#00ff41' }, 
            cursorBlink: true 
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();

        term.writeln('\n\x1b[1;32m[SYS] BOOT SEQUENCE COMPLETE\x1b[0m');
        term.writeln('\x1b[1;33m[MATRIX] ONLINE - READY TO HACK\x1b[0m\n');

        // Captura logs e eventos (código igual ao V43)
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args);
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`\x1b[1;33m> ${msg}\x1b[0m`);
            }
        };

        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                if (e.detail.state === 'INSTALLING') {
                    term.writeln('\n\x1b[1;35m>>> MATRIX DOWNLOAD INITIATED...\x1b[0m');
                }
                else if (e.detail.state === 'SUCCESS') {
                    term.writeln('\n\x1b[1;32m> TARGET INFECTED SUCCESSFULLY! 🎉\x1b[0m');
                }
                else if (e.detail.state === 'ERROR') {
                    if (e.detail.error && (e.detail.error.includes('Improv') || e.detail.error.includes('initialization failed'))) {
                        term.writeln('\n\x1b[1;32m> TARGET INFECTED! (Wi-Fi noise ignored)\x1b[0m');
                    } else if (e.detail.error && e.detail.error.includes('already open')) {
                        term.writeln('\n\x1b[1;33m> PORT LOCKED: DISCONNECT → WAIT 5s → RECONNECT\x1b[0m');
                    } else {
                        term.writeln(`\n\x1b[1;31m> BREACH FAILED: ${e.detail.error}\x1b[0m`);
                    }
                }
            });
        });
    </script>
</body>
</html>
