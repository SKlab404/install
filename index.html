<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER FLASHER SIMPLE</title>
    <!-- VERSÃO ANTIGA E ROBUSTA -->
    <script src="https://unpkg.com/esptool-js@0.2.3/bundle.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        button { padding: 10px 20px; background: #003300; color: #0f0; border: 1px solid #0f0; cursor: pointer; margin: 5px; font-size: 16px; }
        button:hover { background: #005500; }
        #term { width: 100%; height: 400px; background: #111; color: #0f0; border: 1px solid #333; overflow-y: scroll; white-space: pre-wrap; padding: 10px; margin-top: 20px; }
        .red { color: #f00; }
    </style>
</head>
<body>
    <h1>CYBER FLASHER [SIMPLE MODE]</h1>
    
    <button onclick="flash('manifest_std.json')">FLASH STD</button>
    <button onclick="flash('manifest_c5.json')">FLASH C5</button>
    <button onclick="flash('manifest_bruce.json')" style="border-color: #f00; color: #f00;">FLASH BRUCE</button>
    
    <br><br>
    <button onclick="connectSerial()">MONITOR SERIAL</button>
    <button onclick="document.getElementById('term').innerHTML=''">CLEAR</button>

    <div id="term"></div>

    <script>
        var esploader;
        var transport;
        var port;

        function log(msg) {
            document.getElementById('term').innerHTML += msg + "\n";
            document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
        }

        async function flash(manifestUrl) {
            try {
                if (port) { await port.close(); port = null; }
                
                log("Loading " + manifestUrl + "...");
                let resp = await fetch(manifestUrl);
                let manifest = await resp.json();
                
                log("Select Port...");
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                log("Connecting...");
                transport = new esptooljs.Transport(port);
                esploader = new esptooljs.ESPLoader(transport, 115200, esptooljs.ESP_ROM_BAUD, {
                    clean: () => {},
                    writeLine: (l) => log(l),
                    write: (s) => log(s)
                });
                
                await esploader.main_fn();
                await esploader.flash_id();
                
                log("Erasing...");
                await esploader.erase_flash();
                
                let file = manifest.builds[0].parts[0];
                log("Fetching " + file.path + "...");
                let bin = await fetch(file.path).then(r => r.arrayBuffer());
                let data = new Uint8Array(bin);
                
                log("Writing " + data.length + " bytes...");
                await esploader.write_flash(
                    [{ data: data, address: file.offset }],
                    'keep',
                    'keep',
                    false,
                    true,
                    (idx, cnt, total) => { if(cnt%10==0) log("Progress: " + Math.round((cnt/total)*100) + "%"); }
                );
                
                log("Resetting...");
                await transport.setDTR(false);
                await transport.setRTS(true);
                await new Promise(r => setTimeout(r, 100));
                await transport.setRTS(false);
                await port.close();
                port = null;
                
                log("DONE! Click MONITOR SERIAL.");
                
            } catch (e) {
                log("ERROR: " + e);
                console.error(e);
            }
        }

        async function connectSerial() {
            try {
                if (port) { await port.close(); port = null; return; }
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                log("SERIAL CONNECTED");
                
                let decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                let reader = decoder.readable.getReader();
                
                while (true) {
                    let { value, done } = await reader.read();
                    if (done) break;
                    document.getElementById('term').innerHTML += value;
                    document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
                }
            } catch (e) { log("SERIAL ERR: " + e); }
        }
    </script>
</body>
</html>
