<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V27 (C5 FINAL)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { padding: 20px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        button { padding: 15px 25px; margin: 0 10px; background: #003300; color: #fff; border: 1px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #005500; }
        button:disabled { background: #222; color: #555; border-color: #444; }
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <button id="btn-c5" onclick="flash('manifest_c5.json')" disabled>A CARREGAR...</button>
        <button id="btn-std" onclick="flash('manifest_std.json')" disabled>A CARREGAR...</button>
        <button id="btn-bruce" onclick="flash('manifest_bruce.json')" disabled style="color:#f55; border-color:#f55">BRUCE</button>
    </div>

    <div id="term"></div>

    <script type="module">
        import * as esptool from 'https://esm.run/esptool-js@0.5.6';
        window.ESPLoader = esptool.ESPLoader;
        window.Transport = esptool.Transport;
        window.libReady = true;
        
        if (window.term) {
            window.term.writeln('\x1b[1;32m> V27 PRONTA (Modo C5)\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V27 ===');
        let currentPort = null;

        const check = setInterval(() => {
            if (window.libReady) { clearInterval(check); enableButtons(); }
        }, 500);

        function enableButtons() {
            if(document.getElementById('btn-c5').innerText !== "A CARREGAR...") return;
            document.querySelectorAll('button').forEach(b => {
                b.disabled = false;
                b.innerText = b.innerText.replace("A CARREGAR...", "FLASH");
            });
        }

        async function flash(manifestUrl) {
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            try {
                // 1. Limpeza de porta
                if (currentPort) {
                    try { await currentPort.close(); } catch(e) {}
                    currentPort = null;
                }

                term.writeln(`\n> [1] Manifesto: ${manifestUrl}...`);
                let manifest;
                try {
                    manifest = await fetch(manifestUrl).then(r => { if(!r.ok) throw new Error(); return r.json(); });
                } catch (e) {
                    manifest = await fetch('/install/' + manifestUrl).then(r => r.json());
                }

                term.writeln('> [2] Porta Serial...');
                currentPort = await navigator.serial.requestPort();
                await currentPort.open({ baudRate: 115200 });

                term.writeln('> [3] Conectando...');
                const transport = new window.Transport(currentPort);
                const loader = new window.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (d) => term.writeln(d),
                        write: (d) => term.write(d)
                    }
                });

                // Tenta detectar o chip
                let chipName = "DESCONHECIDO";
                try {
                    // *** CORREÇÃO: USAR main() ***
                    chipName = await loader.main();
                } catch (e) {
                    // Se der erro de chip desconhecido (o tal hex 0x5f...), ignoramos!
                    if (e.message.includes("Unknown Chip") || e.message.includes("0x5fd1406f") || e.message.includes("1607549039")) {
                        term.writeln('\x1b[1;33m> AVISO: Chip C5 detetado (não oficial). Forçando flash...\x1b[0m');
                        chipName = "ESP32-C5 (Forced)";
                    } else {
                        throw e; // Outros erros (ex: porta ocupada) mandam parar
                    }
                }
                
                term.writeln(`> Chip: ${chipName}`);
                
                term.writeln('> [4] A APAGAR FLASH...');
                await loader.erase_flash();

                term.writeln('> [5] A ESCREVER...');
                for (let part of manifest.builds[0].parts) {
                    term.writeln(`  -> ${part.path}...`);
                    let bin;
                    try {
                        bin = await fetch(part.path).then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); });
                    } catch(e) {
                        bin = await fetch('/install/' + part.path).then(r => r.arrayBuffer());
                    }

                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {} 
                    });
                }

                term.writeln('\n> [SUCESSO] Reinicia o dispositivo!');
                await loader.hard_reset();
                await currentPort.close();
                currentPort = null;

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
