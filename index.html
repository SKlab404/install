<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Pure Flasher</title>

<style>
body{
    margin:0;
    background:#0b1110;
    color:#8affc1;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

button{
    background:transparent;
    border:1px solid #8affc1;
    color:#8affc1;
    padding:12px 30px;
    font-size:16px;
    cursor:pointer;
    margin-bottom:20px;
}

#log{
    width:80%;
    max-width:800px;
    height:300px;
    border:1px solid #8affc1;
    padding:10px;
    overflow:auto;
}
</style>
</head>
<body>

<button id="connectBtn">CONNECT DEVICE</button>

<div id="log"></div>

<script type="module">

import { ESPLoader, Transport } from "https://cdn.jsdelivr.net/npm/esptool-js@0.5.2/bundle.js";

const logDiv = document.getElementById("log");

function log(msg){
    logDiv.innerHTML += msg + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

document.getElementById("connectBtn").addEventListener("click", async () => {

    try {

        log("Requesting serial port...");

        const port = await navigator.serial.requestPort();

        const transport = new Transport(port);

        const loader = new ESPLoader({
            transport,
            baudrate: 115200,
            terminal: {
                write: (data) => log(data),
                writeLine: (data) => log(data),
                clean: () => { logDiv.innerHTML = ""; }
            }
        });

        log("Connecting to ESP...");

        await loader.main();

        log("Connected.");
        log("Chip detected: " + loader.chipName);

        const mac = await loader.readMac();
        log("MAC: " + mac);

    } catch (err){
        log("Error: " + err);
    }

});

</script>



</body>
</html>
