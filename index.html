<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V30 (BLUE EDITION)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        /* TEMA NOVO: AZUL CYBERPUNK */
        body { background: #000810; color: #00aaff; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        #header { padding: 20px; background: #001122; border-bottom: 2px solid #004488; text-align: center; }
        
        button { 
            padding: 15px 25px; margin: 0 10px; 
            background: #002244; color: #00aaff; border: 1px solid #00aaff; 
            cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase;
        }
        button:hover { background: #004488; box-shadow: 0 0 15px #00aaff; }
        button:disabled { background: #111; color: #444; border-color: #222; box-shadow: none; }
        
        /* Botão Reset SEMPRE VISÍVEL agora */
        #btn-reset { border-color: #ffaa00; color: #ffaa00; }
        #btn-reset:hover { background: #332200; box-shadow: 0 0 15px #ffaa00; }

        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <button id="btn-c5" onclick="flash('manifest_c5.json')" disabled>LOADING...</button>
        <button id="btn-std" onclick="flash('manifest_std.json')" disabled>LOADING...</button>
        <button id="btn-bruce" onclick="flash('manifest_bruce.json')" disabled style="color:#ff5555; border-color:#ff5555">BRUCE</button>
        
        <!-- BOTÃO SEMPRE VISÍVEL -->
        <button id="btn-reset" onclick="location.reload()">⚠️ RESET USB</button>
    </div>

    <div id="term"></div>

    <script type="module">
        import * as esptool from 'https://esm.run/esptool-js@0.5.6';
        window.ESPLoader = esptool.ESPLoader;
        window.Transport = esptool.Transport;
        window.libReady = true;
        if (window.term) {
            window.term.writeln('\x1b[1;36m> SISTEMA V30 PRONTO (Modo Azul)\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        // Terminal Azul
        const term = new Terminal({ theme: { background: '#000810', foreground: '#00aaff', cursor: '#00aaff' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V30 ===');
        term.writeln('> DICA: Se der erro "Port Already Open", DESLIGA O CABO!');

        let currentPort = null;

        const check = setInterval(() => {
            if (window.libReady) { clearInterval(check); enableButtons(); }
        }, 500);

        function enableButtons() {
            if(document.getElementById('btn-c5').innerText !== "LOADING...") return;
            document.querySelectorAll('button:not(#btn-reset)').forEach(b => {
                b.disabled = false;
                b.innerText = b.innerText.replace("LOADING...", "FLASH");
            });
        }

        async function flash(manifestUrl) {
            const btns = document.querySelectorAll('button:not(#btn-reset)');
            btns.forEach(b => b.disabled = true);

            try {
                // Tenta fechar porta antiga se existir
                if (currentPort) {
                    try { await currentPort.close(); } catch(e) {}
                    currentPort = null;
                }

                term.writeln(`\n> [1] Manifesto: ${manifestUrl}...`);
                let manifest;
                try {
                    manifest = await fetch(manifestUrl).then(r => { if(!r.ok) throw new Error(); return r.json(); });
                } catch (e) {
                    manifest = await fetch('/install/' + manifestUrl).then(r => r.json());
                }

                term.writeln('> [2] Porta Serial...');
                try {
                    currentPort = await navigator.serial.requestPort();
                    await currentPort.open({ baudRate: 115200 });
                } catch (e) {
                    if (e.message.includes("already open")) {
                        term.writeln('\n\x1b[1;31m>>> ERRO FATAL: PORTA BLOQUEADA! <<<\x1b[0m');
                        term.writeln('SOLUÇÃO OBRIGATÓRIA:');
                        term.writeln('1. Desliga o cabo USB do computador.');
                        term.writeln('2. Clica no botão amarelo "RESET USB".');
                        term.writeln('3. Volta a ligar o cabo.');
                        throw new Error("Porta presa. Segue as instruções acima.");
                    } else {
                        throw e;
                    }
                }

                term.writeln('> [3] Conectando...');
                const transport = new window.Transport(currentPort);
                const loader = new window.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (d) => term.writeln(d),
                        write: (d) => term.write(d)
                    }
                });

                let chipName = "DESCONHECIDO";
                try {
                    if (typeof loader.main === "function") chipName = await loader.main();
                    else if (typeof loader.main_fn === "function") chipName = await loader.main_fn();
                    else { await loader.connect(); chipName = "Stub"; }
                } catch (e) {
                    if (e.message.includes("Unknown Chip") || e.message.includes("0x5fd1406f")) {
                        term.writeln('\x1b[1;33m> AVISO: Forçando Chip C5...\x1b[0m');
                        chipName = "ESP32-C5 (Forced)";
                    } else { throw e; }
                }
                
                term.writeln(`> Chip: ${chipName}`);
                
                term.writeln('> [4] A APAGAR FLASH...');
                await loader.erase_flash();

                term.writeln('> [5] A ESCREVER...');
                for (let part of manifest.builds[0].parts) {
                    term.writeln(`  -> ${part.path}...`);
                    let bin;
                    try {
                        bin = await fetch(part.path).then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); });
                    } catch(e) {
                        bin = await fetch('/install/' + part.path).then(r => r.arrayBuffer());
                    }

                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {} 
                    });
                }

                term.writeln('\n> [SUCESSO] Reinicia o dispositivo!');
                await loader.hard_reset();
                await currentPort.close();
                currentPort = null;

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
