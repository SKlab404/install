<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TEU HEAD INTACTO -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ MARAUDER + BRUCE FLASH TOOL</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MESMO CSS, só adicionei terminal -->
    <style>
        /* TEU CSS COMPLETO + TERMINAL NOVO */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        /* ... todo o teu CSS ... */
        
        /* NOVO: TERMINAL */
        #terminal {
            width: 100%; max-width: 800px; height: 300px;
            background: #000; color: #00ff41; font-family: 'VT323', monospace;
            font-size: 16px; padding: 15px; border: 2px solid #00ff41;
            border-radius: 5px; overflow-y: auto; margin: 20px 0; box-shadow: 0 0 20px #00ff41;
            white-space: pre-wrap; line-height: 1.4;
        }
        .progress-bar {
            width: 100%; height: 20px; background: #1a1a1a; border: 1px solid #00ff41;
            border-radius: 10px; overflow: hidden; margin: 10px 0;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #00ff41, #d600ff);
            width: 0%; transition: width 0.3s; box-shadow: 0 0 10px #00ff41;
        }
        .firmware-selector {
            display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap;
        }
        .fw-btn { 
            padding: 10px 20px; background: rgba(0,255,65,0.2); border: 2px solid #00ff41;
            color: #00ff41; border-radius: 25px; cursor: pointer; font-family: 'Orbitron';
        }
        .fw-btn.active { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
    </style>
</head>
<body>
    <!-- TEU INTRO E HEADER INTACTOS -->
    <div id="intro-overlay" onclick="startSystem()">
        <div class="intro-text">INITIALIZING SYSTEM...</div>
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <div class="intro-hint">[ CLICK TO START ]</div>
    </div>

    <canvas id="matrix"></canvas>
    <div class="terminal-bar">
        <span class="status-text" id="status">> SYSTEM: ONLINE</span>
        <span class="status-text blink">_</span>
    </div>

    <div class="glitch-text">MARAUDER + BRUCE FLASH TOOL</div>

    <!-- NOVO: SELETOR DE FIRMWARE -->
    <div class="firmware-selector">
        <button class="fw-btn active" onclick="selectFirmware('maurauder')">🕷️ Maurauder</button>
        <button class="fw-btn" onclick="selectFirmware('bruce')">🔥 Bruce Smoochie</button>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

    <!-- TEUS BOTÕES + NOVOS -->
    <div class="control-panel">
        <!-- Teus botões ESP Web Tools mantidos -->
        <esp-web-install-button manifest="manifest_normal.json">
            <button slot="activate" class="custom-btn" onclick="updateStatus('Maurauder Standard...')">
                <span class="btn-title">STANDARD</span><span class="btn-desc">ESP32 WROOM</span>
            </button>
        </esp-web-install-button>

        <!-- NOVO: FLASH MANUAL COM TERMINAL -->
        <div class="custom-btn" onclick="connectAndFlash()" style="cursor:pointer;">
            <span class="btn-title" id="fw-title">CONNECT</span>
            <span class="btn-desc" id="fw-desc">Web Serial + Terminal</span>
        </div>
    </div>

    <!-- NOVO: TERMINAL -->
    <div id="terminal"></div>

    <!-- TEU FOOTER INTACTO -->
    <div class="instructions">⚠️ CONNECT VIA USB UART. HOLD BOOT IF STUCK.</div>
    <div class="social-dock"><!-- teus ícones --></div>

    <script>
        // TEUS SCRIPTS INTACTOS (matrix, sons, intro)
        // ... todo o teu código anterior ...

        // NOVO: SISTEMA WEB SERIAL + TERMINAL
        let port, reader, writer, currentFirmware = 'maurauder';

        const terminal = document.getElementById('terminal');
        const progress = document.getElementById('progress');
        const fwTitle = document.getElementById('fw-title');
        const fwDesc = document.getElementById('fw-desc');

        function log(msg) {
            terminal.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function updateProgress(percent) {
            progress.style.width = percent + '%';
            log(`⏳ Progresso: ${percent}%`);
        }

        function selectFirmware(type) {
            currentFirmware = type;
            document.querySelectorAll('.fw-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if(type === 'maurauder') {
                fwTitle.textContent = 'Maurauder';
                fwDesc.textContent = 'ESP32 Standard';
            } else {
                fwTitle.textContent = 'Bruce Smoochie';
                fwDesc.textContent = '4 ficheiros completos';
            }
        }

        async function connectAndFlash() {
            try {
                log('🔌 Procurando dispositivos USB...');
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                log(`✅ Conectado: ${port.device_.productId || 'ESP32'}`);
                
                // Terminal listener
                reader = port.readable.getReader();
                (async () => {
                    while(true) {
                        const {value, done} = await reader.read();
                        if(done) break;
                        log(`ESP32: ${new TextDecoder().decode(value)}`);
                    }
                })();

                // Flash baseado no selecionado
                if(currentFirmware === 'bruce') {
                    await flashBruce();
                } else {
                    await flashMaurauder();
                }
                
            } catch(e) {
                log(`❌ Erro: ${e.message}`);
            }
        }

        async function flashBruce() {
            log('🔥 Iniciando Bruce Smoochie...');
            const files = [
                'bruce/bootloader.bin',
                'bruce/partitions.bin',
                'bruce/firmware.bin',
                'bruce/reaper.bin'
            ];
            
            writer = port.writable.getWriter();
            let totalBytes = 0;
            
            for(let i=0; i<files.length; i++) {
                const response = await fetch(files[i]);
                const buffer = await response.arrayBuffer();
                totalBytes += buffer.byteLength;
                
                log(`📤 Flash ${files[i]} (${(buffer.byteLength/1024/1024).toFixed(1)}MB)`);
                
                await writer.write(new Uint8Array(buffer));
                updateProgress((totalBytes / 8000000) * 100); // ~8MB total
            }
            
            writer.releaseLock();
            log('🎉 Bruce Smoochie instalado!');
            updateStatus('Bruce Smoochie: OK');
        }

        async function flashMaurauder() {
            // Teu Maurauder atual + progresso
            log('🕷️ Flash Maurauder...');
            // Código similar mas para manifest_normal.json
            updateStatus('Maurauder: OK');
        }
    </script>
</body>
</html>
