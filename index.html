<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER FLASHER MODULAR</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #term { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>CYBER FLASHER [MODULAR]</h1>
    <button id="btnFlash">FLASH C5</button>
    <div id="term"></div>

    <!-- SCRIPT TIPO MODULE (Importante!) -->
    <script type="module">
        // Importa DIRETAMENTE do teu ficheiro local ou do URL completo
        import { Transport, ESPLoader } from 'https://unpkg.com/esptool-js@0.5.4/lib/index.js';

        const term = document.getElementById('term');
        function log(msg) { term.innerText += msg + "\n"; }

        document.getElementById('btnFlash').onclick = async () => {
            try {
                log("Starting...");
                
                // 1. Ler Manifest
                const resp = await fetch('manifest_c5.json');
                const manifest = await resp.json();
                
                // 2. Porta
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                // 3. Conectar (Usando as classes importadas)
                const transport = new Transport(port);
                const loader = new ESPLoader(transport, 115200, null);
                
                log("Connecting to bootloader...");
                const chip = await loader.main_fn();
                log("Chip: " + chip);
                
                log("Erasing...");
                await loader.erase_flash();
                
                // 4. Flash
                const file = manifest.builds[0].parts[0];
                log("Downloading " + file.path);
                const bin = await fetch(file.path).then(r => r.arrayBuffer());
                
                log("Writing...");
                await loader.write_flash({
                    fileArray: [{ data: new Uint8Array(bin), address: file.offset }],
                    flash_size: 'keep',
                    erase_all: false,
                    compress: true,
                });
                
                log("Resetting...");
                await loader.hard_reset();
                await port.close();
                log("DONE!");

            } catch (e) {
                log("ERROR: " + e.message);
                console.error(e);
            }
        };
    </script>
</body>
</html>
