<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<!-- ESP WEB TOOLS -->
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<!-- XTERM -->
<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:black;
    font-family:monospace;
    color:#00ff00;
    overflow:hidden;
}

/* SPLASH */
#splash{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
    transition:1s;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}
#splash h1{
    font-size:4em;
    text-shadow:0 0 25px #00ff00;
}

/* APP */
#app{
    opacity:0;
    transition:1s;
}
#app.show{
    opacity:1;
}

#term{
    width:100%;
    height:100vh;
    padding:20px;
}

#flashArea{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
}

.cyberBtn{
    background:#002200 !important;
    color:#00ff00 !important;
    border:2px solid #00ff00 !important;
    padding:15px 40px !important;
    font-family:monospace !important;
    font-size:16px !important;
    cursor:pointer !important;
    box-shadow:0 0 15px #00ff00 !important;
}
.cyberBtn:hover{
    background:#003300 !important;
    box-shadow:0 0 25px #00ff00 !important;
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to initialize...</p>
</div>

<!-- APP -->
<div id="app">

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cyberBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

</div>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function typeLine(text, delay=35){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

function enter(){

    document.getElementById("splash").classList.add("fade");

    // INTRO MÚSICA
    const intro=new Audio("https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume=0.6;
    intro.play();

    setTimeout(()=>{
        document.getElementById("app").classList.add("show");
        hackerIntro();
    },600);
}

async function hackerIntro(){

    term.writeln("\x1b[1;32mSKLAB404 Secure Access Terminal\x1b[0m");
    term.writeln("");

    await sleep(500);
    await typeLine("> Initializing secure environment...");
    await sleep(500);
    await typeLine("> Loading kernel modules...");
    await sleep(500);
    await typeLine("> Establishing encrypted channel...");
    await sleep(500);
    await typeLine("> Environment ready.");
    term.writeln("");
    term.writeln("\x1b[1;33mPress AUTHORIZE FLASH to begin.\x1b[0m");
}

/* CAPTURA PROGRESSO REAL */
const originalConsoleLog = console.log;

console.log = function (...args) {
    const msg = args.join(" ");

    if (
        msg.includes("Writing") ||
        msg.includes("Erasing") ||
        msg.includes("%") ||
        msg.includes("Hash of data verified")
    ) {
        term.writeln("> " + msg);
    }

    originalConsoleLog.apply(console, args);
};

/* ESTADOS */
document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("> Flashing firmware...");
    }
    else if(e.detail.state==="SUCCESS"){
        term.writeln("\x1b[1;32m✓ Flash complete\x1b[0m");
    }
    else if(e.detail.state==="ERROR"){
        term.writeln("\x1b[1;31m✗ "+e.detail.error+"\x1b[0m");
    }
});

</script>

</body>
</html>
