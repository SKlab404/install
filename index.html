<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARAUDER FLASHER</title>
    
    <!-- ESP WEB TOOLS (O que a Momentum usa!) -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #00ff41;
            font-family: 'Orbitron', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            text-shadow: 0 0 20px #00ff41;
        }
        
        .card {
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 30px;
            margin: 15px;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }
        
        .card h2 {
            margin-top: 0;
            color: #fff;
        }
        
        .card p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        esp-web-install-button {
            display: block;
        }
        
        esp-web-install-button button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #00ff41;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
        }
        
        esp-web-install-button button:hover {
            background: #00cc33;
            box-shadow: 0 0 20px #00ff41;
        }
        
        .danger {
            border-color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
        }
        
        .danger button {
            background: #ff0055;
            color: #fff;
        }
        
        .danger button:hover {
            background: #cc0044;
        }
    </style>
</head>
<body>
    <h1>⚡ MARAUDER FLASHER ⚡</h1>
    
    <div class="card">
        <h2>ESP32 Standard</h2>
        <p>Para DevKit V1, WROOM, WROVER</p>
        <esp-web-install-button manifest="manifest_std.json"></esp-web-install-button>
    </div>
    
    <div class="card">
        <h2>M5Stack C5</h2>
        <p>M5StickC, M5StickC Plus, Cardputer</p>
        <esp-web-install-button manifest="manifest_c5.json"></esp-web-install-button>
    </div>
    
    <div class="card danger">
        <h2>🔥 BRUCE S3</h2>
        <p>⚠️ APENAS Smoochie / ESP32-S3 Zero</p>
        <esp-web-install-button manifest="manifest_bruce.json"></esp-web-install-button>
    </div>
    
    <p style="margin-top: 50px; color: #666; font-size: 12px;">
        Powered by ESP Web Tools • Chrome/Edge Required
    </p>
</body>
</html>
