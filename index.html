<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 – C5 Test</title>
<style>
body{
    background:#0b1110;
    color:#8affc1;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}
button{
    padding:12px 30px;
    border:1px solid #8affc1;
    background:transparent;
    color:#8affc1;
    cursor:pointer;
}
#log{
    width:90%;
    max-width:900px;
    height:350px;
    border:1px solid #8affc1;
    margin-top:20px;
    padding:10px;
    overflow:auto;
}
</style>
</head>
<body>

<button id="connectBtn">CONNECT ESP32-C5</button>
<div id="log"></div>

<script type="module">

// 🔥 Usar build mais recente do repositório oficial
import { ESPLoader, Transport } 
from "https://rawcdn.githack.com/espressif/esptool-js/master/bundle.js";

const logDiv = document.getElementById("log");

function log(msg){
    logDiv.innerHTML += msg + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

document.getElementById("connectBtn").addEventListener("click", async () => {

    let port;

    try {

        log("Requesting serial port...");
        port = await navigator.serial.requestPort();

        await port.open({ baudRate: 115200 });

        const transport = new Transport(port);

        const loader = new ESPLoader({
            transport,
            baudrate: 115200,
            terminal: {
                write: (data) => log(data),
                writeLine: (data) => log(data),
                clean: () => { logDiv.innerHTML = ""; }
            }
        });

        log("Connecting to ESP...");

        await loader.main();

        log("Connected!");
        log("Chip: " + loader.chipName);

        const mac = await loader.readMac();
        log("MAC: " + mac);

    } catch (err) {

        log("ERROR: " + err);

        if (port) {
            try { await port.close(); } catch(e){}
        }
    }

});
</script>

</body>
</html>
