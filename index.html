<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V21 (HIBRIDO)</title>
    
    <!-- TERMINAL VISUAL -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { padding: 20px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        button { padding: 15px 25px; margin: 0 10px; background: #003300; color: #fff; border: 1px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #005500; }
        button:disabled { background: #222; color: #555; border-color: #444; }
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <button id="btn-c5" onclick="flash('manifest_c5.json')" disabled>A CARREGAR...</button>
        <button id="btn-std" onclick="flash('manifest_std.json')" disabled>A CARREGAR...</button>
        <button id="btn-bruce" onclick="flash('manifest_bruce.json')" disabled style="color:#f55; border-color:#f55">BRUCE</button>
    </div>

    <div id="term"></div>

    <!-- O SEGREDO: Carregar como MÓDULO (Igual à V16 que funcionou) -->
    <script type="module">
        import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js@0.5.4/lib/index.js?module';
        
        // Guardar no window para o nosso script usar
        window.ESPLoader = ESPLoader;
        window.Transport = Transport;
        window.libReady = true;
        
        if (window.term) {
            window.term.writeln('\x1b[1;32m> MÓDULO CARREGADO COM SUCESSO!\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V21 (O HÍBRIDO) ===');
        term.writeln('> A importar módulos...');

        // Verificar se carregou
        const check = setInterval(() => {
            if (window.libReady) {
                clearInterval(check);
                enableButtons();
            }
        }, 500);

        function enableButtons() {
            if(document.getElementById('btn-c5').innerText !== "A CARREGAR...") return;
            document.querySelectorAll('button').forEach(b => {
                b.disabled = false;
                b.innerText = b.innerText.replace("A CARREGAR...", "FLASH");
            });
        }

        async function flash(manifestUrl) {
            if (!window.libReady) return alert("Erro: Módulo não carregou.");
            
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            try {
                term.writeln(`\n> [1] A ler manifesto: ${manifestUrl}...`);
                // Correção para o 404: Tenta ler da raiz se falhar
                let manifest;
                try {
                    manifest = await fetch(manifestUrl).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
                } catch (e) {
                    term.writeln('> Aviso: Ficheiro não encontrado. A tentar caminho absoluto...');
                    manifest = await fetch('/install/' + manifestUrl).then(r => r.json());
                }

                term.writeln('> [2] Porta Serial...');
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                term.writeln('> [3] A conectar (Modo Seguro)...');
                
                // --- A CORREÇÃO DA V17 (Para não dar erro getInfo) ---
                const transport = new window.Transport(port);
                const loader = new window.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (d) => term.writeln(d),
                        write: (d) => term.write(d)
                    }
                });
                // -----------------------------------------------------

                const chip = await loader.main_fn();
                term.writeln(`> Chip: ${chip}`);

                term.writeln('> [4] A APAGAR FLASH...');
                await loader.erase_flash();

                term.writeln('> [5] A ESCREVER...');
                for (let part of manifest.builds[0].parts) {
                    term.writeln(`  -> ${part.path}...`);
                    // Correção de caminho para os ficheiros .bin
                    let binUrl = part.path;
                    let bin;
                    try {
                        bin = await fetch(binUrl).then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); });
                    } catch(e) {
                        binUrl = '/install/' + part.path; // Tenta com prefixo
                        bin = await fetch(binUrl).then(r => r.arrayBuffer());
                    }

                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {} 
                    });
                }

                term.writeln('\n> [SUCESSO] Reinicia o Marauder!');
                await loader.hard_reset();
                await port.close();

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
