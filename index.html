<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 V55</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
    background:#000;
    color:#0f0;
    font-family:monospace;
    height:100vh;
    overflow:hidden;
}

/* SPLASH */
#splash{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:radial-gradient(circle at center,#001122 0%,#000 70%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:1s;
    z-index:100;
}
#splash.fade{
    opacity:0;
    transform:scale(1.1);
    pointer-events:none;
}
#splash h1{
    font-size:4em;
    text-shadow:0 0 40px #0f0;
}
#splash p{
    opacity:.8;
}

/* APP */
#app{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    opacity:0;
    transition:1s .3s;
}
#app.show{
    opacity:1;
}

#header{
    background:#111;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #333;
}

#controls{
    background:#111;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #333;
}

esp-web-install-button button{
    background:#003300 !important;
    color:#0f0 !important;
    border:2px solid #0f0 !important;
    padding:12px 25px !important;
    font-family:monospace !important;
    cursor:pointer !important;
}

#term{
    flex:1;
    padding:10px;
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to connect...</p>
</div>

<!-- APP -->
<div id="app">

<div id="header">
    <h2>SKLAB404 IRC INSTALLER</h2>
</div>

<div id="controls">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate">C5</button>
    </esp-web-install-button>

    <esp-web-install-button manifest="manifest_std.json">
        <button slot="activate">STD</button>
    </esp-web-install-button>

    <esp-web-install-button manifest="manifest_bruce.json">
        <button slot="activate">BRUCE</button>
    </esp-web-install-button>
</div>

<div id="term"></div>

</div>

<script>
const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();

window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function typeLine(text,delay=35){
    return new Promise(resolve=>{
        let i=0;
        const interval=setInterval(()=>{
            term.write(text[i]);
            i++;
            if(i>=text.length){
                clearInterval(interval);
                term.write("\r\n");
                resolve();
            }
        },delay);
    });
}

async function enter(){

    document.getElementById("splash").classList.add("fade");

    const intro=new Audio("https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume=0.6;
    intro.play();

    await sleep(600);

    document.getElementById("app").classList.add("show");

    term.writeln("\x1b[1;32m*** mIRC v6.35 ***\x1b[0m");
    term.writeln("");

    await typeLine("/nick SeLoS");
    await typeLine("/server irc.sklab404.net 6667");

    term.writeln("*** Connecting to irc.sklab404.net...");
    await sleep(1000);

    term.writeln("*** Connected");
    term.writeln("*** Welcome to SKLAB404 IRC Network SeLoS");
    term.writeln("");

    await typeLine("/join #lab404");

    term.writeln("\x1b[1;33m*** Now talking in #lab404\x1b[0m");
    term.writeln("\x1b[1;36m<Admin>\x1b[0m Welcome SeLoS.");
    term.writeln("\x1b[1;35m<Root>\x1b[0m Installer ready.");
    term.writeln("");
    term.writeln("\x1b[1;32mType /install to flash device\x1b[0m");
}

/* Captura logs do installer */
console.log = (...args)=>{
    const msg=args.join(" ");
    if(msg.includes("Writing")||msg.includes("Erasing")||msg.includes("%")){
        term.writeln("> "+msg);
    }
};

document.querySelectorAll("esp-web-install-button").forEach(btn=>{
    btn.addEventListener("state-change",(e)=>{
        const name=btn.querySelector("button").textContent;

        if(e.detail.state==="INSTALLING"){
            term.writeln("\n>>> "+name+" flashing...");
        }
        else if(e.detail.state==="SUCCESS"){
            term.writeln("\x1b[1;32m✓ FLASH COMPLETE\x1b[0m");
        }
        else if(e.detail.state==="ERROR"){
            term.writeln("\x1b[1;31m✗ "+e.detail.error+"\x1b[0m");
        }
    });
});
</script>

</body>
</html>
