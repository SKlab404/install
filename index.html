<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Flash Station</title>
    <!-- Importar o Script Oficial do ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; text-align: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { 
            background: #222; border: 2px solid #333; padding: 20px; border-radius: 10px; width: 300px;
            transition: all 0.3s;
        }
        .card:hover { border-color: #0f0; transform: translateY(-5px); box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        .card h2 { margin-top: 0; color: #fff; }
        .card p { color: #888; font-size: 0.9em; height: 40px; }
        .danger-zone { border-color: #f00 !important; }
        .danger-zone:hover { box-shadow: 0 0 15px rgba(255,0,0,0.3); }
        .danger-text { color: #f00; font-weight: bold; }
        
        /* Estilo do Botão do ESP Tools */
        esp-web-install-button {
            display: block;
            margin-top: 15px;
        }
        
        button[slot="activate"] {
            background: #333; color: #fff; border: 1px solid #555; padding: 10px 20px;
            font-family: monospace; cursor: pointer; width: 100%; font-size: 1.1em;
            border-radius: 5px;
        }
        button[slot="activate"]:hover { background: #444; }
        
        .bruce-btn { background: linear-gradient(45deg, #a00, #500) !important; border: 1px solid #f00 !important; }
    </style>
</head>
<body>

    <h1>🚀 ESP32 FLASH STATION</h1>
    <p>Escolhe a tua board com cuidado! Flashar o firmware errado pode danificar o hardware.</p>

    <div class="container">

        <!-- CARD 1: MARAUDER C5 -->
        <div class="card">
            <h2>📱 Marauder C5</h2>
            <p>Para M5StickC / Plus / Plus2.<br>Chip: ESP32 (Pico)</p>
            <esp-web-install-button manifest="manifest_c5.json">
                <button slot="activate">INSTALAR C5</button>
            </esp-web-install-button>
        </div>

        <!-- CARD 2: MARAUDER STANDARD -->
        <div class="card">
            <h2>📟 Marauder STD</h2>
            <p>Para ESP32 DevKit V1 / WROOM.<br>Chip: ESP32 Standard</p>
            <esp-web-install-button manifest="manifest_std.json">
                <button slot="activate">INSTALAR STD</button>
            </esp-web-install-button>
        </div>

        <!-- CARD 3: BRUCE SMOOCHIE (PERIGO) -->
        <div class="card danger-zone">
            <h2>🔥 BRUCE S3</h2>
            <p class="danger-text">⚠️ APENAS PARA SMOOCHIE!<br>Chip: ESP32-S3</p>
            <esp-web-install-button manifest="manifest_bruce.json">
                <button slot="activate" class="bruce-btn">INSTALAR REAPER</button>
            </esp-web-install-button>
        </div>

    </div>

    <script>
        // Proteção Adicional: Verificar compatibilidade básica do chip
        // Nota: O ESP Web Tools já verifica se o chip é S3 ou ESP32 normal e bloqueia se for diferente.
        // Isso é a melhor proteção de hardware que temos via browser.
        
        const bruceBtn = document.querySelector('.bruce-btn');
        if(bruceBtn) {
            bruceBtn.addEventListener('click', (e) => {
                if(!confirm("⚠️ ATENÇÃO ⚠️\n\nEstás prestes a instalar o BRUCE SMOOCHIE.\nEsta versão é exclusiva para a board Smoochie S3.\n\nSe usares noutra board S3 genérica, podes QUEIMAR componentes.\n\nConfirmas que tens uma Smoochie ligada?")) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            });
        }
    </script>

</body>
</html>
