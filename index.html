<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V18 (OFFLINE)</title>
    <!-- XTERM -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <!-- O TEU FICHEIRO LOCAL -->
    <script src="https://cdn.jsdelivr.net/npm/esptool-js@0.5.4/bundle.min.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; margin: 0; display: flex; flex-direction: column; }
        button { padding: 15px; background: #003300; color: #0f0; border: 1px solid #0f0; margin: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #333; color: #555; }
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div style="text-align:center; border-bottom:1px solid #333;">
        <button onclick="flash('manifest_c5.json')">FLASH C5</button>
        <button onclick="flash('manifest_std.json')">FLASH STD</button>
        <button onclick="flash('manifest_bruce.json')" style="color:#f55; border-color:#f55">FLASH BRUCE</button>
    </div>

    <div id="term"></div>

    <script>
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();

        term.writeln('=== V18 OFFLINE MODE ===');
        
        // Verificar se carregou
        if (typeof esptooljs === 'undefined') {
            term.writeln('\x1b[1;31m> ERRO: O ficheiro "loader.js" não está na pasta!\x1b[0m');
            term.writeln('> 1. Vai a https://unpkg.com/esptool-js@0.5.4/bundle.js');
            term.writeln('> 2. Copia tudo e guarda como "loader.js" ao lado deste html.');
        } else {
            term.writeln('\x1b[1;32m> BIBLIOTECA DETETADA LOCALMENTE!\x1b[0m');
        }

        async function flash(manifestUrl) {
            if (typeof esptooljs === 'undefined') return alert("Falta o loader.js!");

            try {
                term.writeln(`\n> Lendo ${manifestUrl}...`);
                const manifest = await fetch(manifestUrl).then(r => r.json());

                term.writeln('> Porta Serial...');
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                term.writeln('> Conectando...');
                const transport = new esptooljs.Transport(port);
                
                // NOTA: No bundle antigo, usa-se loader.main_fn() e não o objeto de opções novo
                const loader = new esptooljs.ESPLoader(transport, 115200, null);

                // Redirecionar Logs
                loader.debug = (s) => term.writeln('  [DBG] ' + s);
                loader.info = (s) => term.writeln('  [INF] ' + s);

                await loader.main_fn();
                term.writeln('> Apagando Flash...');
                await loader.erase_flash();

                for (let part of manifest.builds[0].parts) {
                    term.writeln(`> Escrevendo ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {
                             term.write('.'); // Progresso simples
                        }
                    });
                    term.writeln(' OK');
                }

                await loader.hard_reset();
                await port.close();
                term.writeln('\n> FEITO! REINICIA O MARAUDER.');

            } catch (e) {
                term.writeln(`\n> ERRO: ${e.message}`);
            }
        }
    </script>
</body>
</html>
