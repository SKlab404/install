<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SKLAB404 - SPLASH</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; overflow: hidden; }

        /* SPLASH SCREEN */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center; cursor: pointer;
        }
        #splash h1 { font-size: 3em; margin-bottom: 20px; text-shadow: 0 0 20px #0f0; }
        #splash p { font-size: 1.2em; opacity: 0.8; }

        /* MAIN APP (escondida inicialmente) */
        #app { display: none; height: 100vh; flex-direction: column; }
        #controls { padding: 20px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        esp-web-install-button button { 
            background: #004400 !important; color: #fff !important; 
            border: 2px solid #0f0 !important; padding: 15px 30px !important;
            font-weight: bold !important; cursor: pointer !important; font-family: monospace !important;
        }
        esp-web-install-button { --esp-tools-card-background-color: transparent !important; }
        esp-web-install-button button:hover { background: #006600 !important; box-shadow: 0 0 15px #0f0 !important; }
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN (tocas para entrar) -->
    <div id="splash" onclick="enterApp()">
        <h1>SKLAB404</h1>
        <p>Click para entrar + intro.mp3</p>
    </div>

    <!-- APP PRINCIPAL (aparece depois do clique) -->
    <div id="app">
        <div id="controls">
            <esp-web-install-button manifest="manifest_c5.json">
                <button slot="activate">C5</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_std.json">
                <button slot="activate">STD</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_bruce.json">
                <button slot="activate" style="border-color:#f55 !important;">BRUCE</button>
            </esp-web-install-button>
        </div>
        <div id="term"></div>
    </div>

    <script>
        let introPlayed = false;

        function enterApp() {
            // ESCONDE SPLASH
            document.getElementById('splash').style.display = 'none';
            
            // MOSTRA APP
            document.getElementById('app').style.display = 'flex';
            
            // TOCA INTRO.MP3 (agora desbloqueado pelo teu clique)
            if (!introPlayed) {
                const intro = new Audio("https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3");
                intro.volume = 0.6;
                intro.play();
                introPlayed = true;
            }
        }

        // TERMINAL (só ativa após entrar)
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();

        // LOGS + SUCESSO
        console.log = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                const name = b.querySelector('button').textContent;
                if (e.detail.state === 'INSTALLING') term.writeln(`\n>>> ${name}`);
                else if (e.detail.state === 'SUCCESS') term.writeln('\n\x1b[1;32m✓ SUCESSO!\x1b[0m');
                else if (e.detail.state === 'ERROR') {
                    if (e.detail.error.includes('Improv')) {
                        term.writeln('\n\x1b[1;32m✓ SUCESSO! (skip)\x1b[0m');
                    } else {
                        term.writeln(`\n\x1b[1;31m✗ ${e.detail.error}\x1b[0m`);
                    }
                }
            });
        });
    </script>
</body>
</html>
