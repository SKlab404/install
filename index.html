<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK404 LAB - FLASH TOOL</title>
    <!-- Importar biblioteca de Flash Real -->
    <script src="https://unpkg.com/esptool-js@0.4.3/bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; color: #00ff41; font-family: 'Orbitron', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        /* BARRA DE PROGRESSO REAL */
        #progressContainer {
            width: 100%; max-width: 800px; height: 30px;
            background: #111; border: 2px solid #333; border-radius: 15px;
            margin: 20px 0; overflow: hidden; position: relative; display: none;
        }
        #progressBar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #d600ff, #00ff41);
            transition: width 0.2s; box-shadow: 0 0 20px #00ff41;
        }
        #progressText {
            position: absolute; width: 100%; text-align: center; top: 5px;
            font-family: 'VT323'; font-size: 18px; color: #fff; text-shadow: 1px 1px 2px #000;
        }

        /* TERMINAL */
        #terminal {
            width: 100%; max-width: 800px; height: 300px;
            background: #050505; border: 2px solid #00ff41; border-radius: 5px;
            padding: 15px; overflow-y: auto; font-family: 'VT323', monospace;
            white-space: pre-wrap; color: #ccc; margin-bottom: 20px;
        }

        /* BOTÕES */
        .btn-bruce {
            background: linear-gradient(45deg, #4b0082, #d600ff); color: #fff;
            padding: 20px 40px; border: none; border-radius: 50px;
            font-family: 'Orbitron'; font-weight: bold; font-size: 18px;
            cursor: pointer; box-shadow: 0 0 20px rgba(214, 0, 255, 0.4);
            transition: transform 0.2s; text-transform: uppercase;
        }
        .btn-bruce:hover { transform: scale(1.05); box-shadow: 0 0 40px #d600ff; }

        .header { margin-bottom: 30px; text-align: center; }
        h1 { text-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MARAUDER + BRUCE TOOL</h1>
        <p style="font-family:'VT323';font-size:20px;color:#888">// ADVANCED FIRMWARE INSTALLER //</p>
    </div>

    <!-- BOTÃO DE FLASH -->
    <button id="btnFlash" class="btn-bruce" onclick="flashBruce()">
        🔥 FLASH BRUCE SMOOCHIE
    </button>

    <!-- BARRA DE PROGRESSO -->
    <div id="progressContainer">
        <div id="progressBar"></div>
        <div id="progressText">0%</div>
    </div>

    <!-- TERMINAL -->
    <div id="terminal">
        > SYSTEM READY...
        > Aguardando conexão...
    </div>

    <script>
        const term = document.getElementById('terminal');
        const pContainer = document.getElementById('progressContainer');
        const pBar = document.getElementById('progressBar');
        const pText = document.getElementById('progressText');

        function log(msg) {
            term.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            term.scrollTop = term.scrollHeight;
        }

        async function flashBruce() {
            if (!navigator.serial) return alert("O teu browser não suporta Serial API. Usa Chrome ou Edge.");

            try {
                // 1. Conectar USB
                log("🔌 Seleciona o ESP32 na janela...");
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Velocidade padrão para handshake
                
                log("✅ Porta aberta! Inicializando Flash Loader...");
                
                // 2. Inicializar ESPLoader (A biblioteca mágica)
                // Usa o objeto global 'esptooljs' carregado pelo script
                const transport = new esptooljs.Transport(port);
                const esploader = new esptooljs.ESPLoader(transport, 921600, null); // 921600 = Flash rápido
                
                // Conectar ao chip
                await esploader.main_fn();
                log(`💾 Chip detectado: ${await esploader.chip.get_chip_description(esploader)}`);

                // 3. Preparar os ficheiros (Mapeamento de memória para ESP32-S3)
                log("📥 Baixando ficheiros do servidor...");
                
                const fileArray = [];
                
                // Bootloader -> 0x0
                const dataBoot = await fetchBinary('bruce/bootloader.bin');
                fileArray.push({ data: dataBoot, address: 0x0 });
                log("📦 Bootloader carregado (Destino: 0x0)");

                // Partitions -> 0x8000
                const dataPart = await fetchBinary('bruce/partitions.bin');
                fileArray.push({ data: dataPart, address: 0x8000 });
                log("📦 Partitions carregado (Destino: 0x8000)");

                // Firmware -> 0x10000
                const dataFirm = await fetchBinary('bruce/firmware.bin');
                fileArray.push({ data: dataFirm, address: 0x10000 });
                log(`📦 Firmware carregado (${(dataFirm.length/1024/1024).toFixed(2)} MB) (Destino: 0x10000)`);
                
                // Reaper -> Normalmente é o filesystem ou App1.
                // ATENÇÃO: Se o reaper.bin for um filesystem, o endereço varia. 
                // Vou assumir que é uma partição de dados grande logo a seguir.
                // Se o firmware falhar, tenta flashar sem o reaper primeiro.
                const dataReap = await fetchBinary('bruce/reaper.bin');
                // Offset comum para SPIFFS/LittleFS se não for definido na partition table é difícil adivinhar.
                // Mas muitas vezes em S3 custom boards é 0x290000 ou similar.
                // VOU COLOCAR NO ARRAY, mas o esptool vai gravar onde dissermos.
                // Se não souberes o endereço exato do REAPER, é melhor flashar só os 3 primeiros para arrancar.
                // fileArray.push({ data: dataReap, address: 0x???? }); 
                
                log("⚠️ NOTA: A instalar Bootloader, Partitions e Firmware principal.");
                log("⚠️ O ficheiro 'Reaper' foi ignorado por falta de endereço exato (segurança)."); 
                log("🚀 O Bruce deve arrancar na mesma!");

                // 4. FLASHAR COM BARRA DE PROGRESSO
                pContainer.style.display = 'block';
                log("🔥 A INICIAR FLASH... NÃO DESLIGUE!");

                await esploader.write_flash(
                    fileArray,
                    'keep',
                    'keep',
                    'keep',
                    false,
                    true,
                    (fileIndex, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        pBar.style.width = percent + '%';
                        pText.innerText = percent + '%';
                    }
                );

                log("🎉 SUCESSO! O Flash terminou.");
                log("🔄 A reiniciar o ESP32...");
                
                // Reset ao chip
                await transport.setDTR(false);
                await transport.setRTS(true);
                
            } catch (e) {
                log(`❌ ERRO CRÍTICO: ${e.message}`);
                console.error(e);
            }
        }

        async function fetchBinary(url) {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`Falha ao baixar ${url}`);
            const blob = await resp.blob();
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsBinaryString(blob);
            });
        }
    </script>
</body>
</html>
