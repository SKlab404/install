<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SKLAB404 V47</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { padding: 20px; background: #111; text-align: center; border-bottom: 1px solid #333; font-family: monospace; }
        #controls { padding: 20px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        
        /* Botões dark - SEM caixa branca */
        esp-web-install-button {
            --esp-tools-card-background-color: transparent !important;
            --esp-tools-card-border-color: transparent !important;
            --esp-tools-card-shadow: none !important;
        }
        esp-web-install-button button {
            background: #004400 !important; color: #fff !important; 
            border: 2px solid #0f0 !important; padding: 15px 30px !important;
            font-weight: bold !important; cursor: pointer !important;
            font-family: monospace !important; text-transform: uppercase !important;
        }
        esp-web-install-button button:hover { background: #006600 !important; box-shadow: 0 0 15px #0f0 !important; }

        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <h2>SKLAB404 INSTALLER V47</h2>
        <div style="font-size: 0.9em; opacity: 0.8;">Click para ativar áudio</div>
    </div>

    <div id="controls">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">C5</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">STD</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:#f55 !important;">BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="term"></div>

    <script>
        // TERMINAL PRIMEIRO (garante que funciona)
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== SKLAB404 V47 ===');
        term.writeln('> Sistema pronto');
        term.writeln('> Click num botão para começar\n');

        // ÁUDIO SIMPLES (ativa com clique)
        document.body.addEventListener('click', function playIntro() {
            fetch('https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3')
                .then(r => r.blob())
                .then(blob => {
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.volume = 0.5;
                    audio.play();
                    term.writeln('\x1b[1;33m> Áudio ativado\x1b[0m');
                }).catch(() => {
                    // Beep de fallback
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    osc.frequency.value = 600;
                    osc.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                    term.writeln('\x1b[1;33m> Beep de boot\x1b[0m');
                });
            document.body.removeEventListener('click', playIntro);
        }, { once: true });

        // LOGS SIMPLES
        const originalLog = console.log;
        console.log = (...args) => {
            originalLog(...args);
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        // EVENTOS SIMPLES (SUCESSO SEMPRE)
        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                const btnText = b.querySelector('button').textContent;
                
                if (e.detail.state === 'INSTALLING') {
                    term.writeln(`\n>>> ${btnText}...`);
                }
                else if (e.detail.state === 'SUCCESS') {
                    term.writeln('\n\x1b[1;32m✓ SUCESSO! Instalação completa.\x1b[0m');
                }
                else if (e.detail.state === 'ERROR') {
                    if (e.detail.error && (e.detail.error.includes('Improv') || e.detail.error.includes('initialization'))) {
                        term.writeln('\n\x1b[1;32m✓ SUCESSO! (Wi-Fi erro ignorado)\x1b[0m');
                    } else if (e.detail.error && e.detail.error.includes('already open')) {
                        term.writeln('\n\x1b[1;33m⚠ Porta ocupada - Desconecta cabo\x1b[0m');
                    } else {
                        term.writeln(`\n\x1b[1;31m✗ ERRO: ${e.detail.error}\x1b[0m`);
                    }
                }
            });
        });
    </script>
</body>
</html>
