<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:black;
    overflow:hidden;
    font-family:monospace;
}

/* VIDEO BACKGROUND */
#bgvid{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
    opacity:0.25;
}

/* GREEN OVERLAY */
#overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,20,0,0.6);
    z-index:-1;
}

/* TERMINAL */
#term{
    width:100%;
    height:100vh;
    padding:20px;
}
</style>
</head>
<body>

<video autoplay muted loop id="bgvid">
    <source src="https://cdn.coverr.co/videos/coverr-matrix-code-1579/1080p.mp4" type="video/mp4">
</video>

<div id="overlay"></div>

<div id="term"></div>

<!-- BOTÕES INVISÍVEIS -->
<esp-web-install-button id="c5" manifest="manifest_c5.json" style="display:none"></esp-web-install-button>
<esp-web-install-button id="std" manifest="manifest_std.json" style="display:none"></esp-web-install-button>
<esp-web-install-button id="bruce" manifest="manifest_bruce.json" style="display:none"></esp-web-install-button>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:15,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function type(text,delay=30){
    return new Promise(resolve=>{
        let i=0;
        const inter=setInterval(()=>{
            term.write(text[i]);
            i++;
            if(i>=text.length){
                clearInterval(inter);
                term.write("\r\n");
                resolve();
            }
        },delay);
    });
}

async function startSequence(){

    term.writeln("\x1b[1;32mSKLAB404 Secure Access Terminal\x1b[0m");
    term.writeln("");
    await sleep(500);

    await type("> Initializing secure environment...");
    await sleep(800);

    await type("> Scanning USB ports...");
    await sleep(1000);

    await type("> Device detected: ESP32");
    await sleep(700);

    await type("> Bypassing bootloader security...");
    await sleep(1200);

    await type("> Injecting payload...");
    await sleep(1000);

    term.writeln("\x1b[1;33m> Awaiting user authorization...\x1b[0m");

    // DISPARA INSTALL REAL
    document.getElementById("c5").shadowRoot
        .querySelector("button")
        .click();
}

// Captura logs do esp
document.querySelectorAll("esp-web-install-button").forEach(btn=>{
    btn.addEventListener("state-change",(e)=>{
        if(e.detail.state==="INSTALLING"){
            term.writeln("> Flashing firmware...");
        }
        else if(e.detail.state==="SUCCESS"){
            term.writeln("\x1b[1;32m✓ Injection complete\x1b[0m");
        }
        else if(e.detail.state==="ERROR"){
            term.writeln("\x1b[1;31m✗ "+e.detail.error+"\x1b[0m");
        }
    });
});

startSequence();

</script>
</body>
</html>
