<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER CONSOLE FLASHER</title>
    
    <!-- 1. ESPLoader Bundle (Global) -->
    <script src="https://unpkg.com/esptool-js@0.5.4/bundle.js"></script>
    
    <!-- 2. Xterm -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; height: 100vh; margin: 0; }
        #controls { width: 250px; background: #111; padding: 20px; border-right: 1px solid #333; }
        #terminal { flex: 1; background: #000; padding: 10px; }
        
        button {
            width: 100%; padding: 15px; margin-bottom: 10px;
            background: #004400; color: #fff; border: 1px solid #0f0;
            cursor: pointer; font-family: monospace; font-weight: bold;
        }
        button:hover { background: #006600; }
        h2 { color: #fff; text-align: center; }
    </style>
</head>
<body>

    <div id="controls">
        <h2>FLASHER</h2>
        <button onclick="startFlash('manifest_c5.json')">FLASH C5 (BETA)</button>
        <button onclick="startFlash('manifest_std.json')">FLASH STD</button>
        <button onclick="startFlash('manifest_bruce.json')" style="border-color:red;">FLASH BRUCE</button>
        <div id="status" style="color:#aaa; margin-top:20px; text-align:center;">Idle</div>
    </div>

    <div id="terminal"></div>

    <script>
        // 1. Configurar Terminal
        const term = new Terminal({ theme: { background: '#000', foreground: '#00ff41' }, fontFamily: 'Courier New', fontSize: 14 });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();

        term.writeln('=== READY TO FLASH ===');

        // 2. Função de Flash
        async function startFlash(manifestUrl) {
            try {
                if (typeof esptooljs === 'undefined') return term.writeln('ERROR: Library not loaded!');

                term.writeln(`\n> FETCHING ${manifestUrl}...`);
                const resp = await fetch(manifestUrl);
                const manifest = await resp.json();

                term.writeln('> SELECT PORT...');
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                term.writeln('> CONNECTING...');
                
                // INICIALIZA O LOADER
                const transport = new esptooljs.Transport(port);
                const loader = new esptooljs.ESPLoader(transport, 115200, null);

                // *** O SEGREDO: REDIRECIONAR LOGS INTERNOS PARA O TERMINAL ***
                loader.debug = (s) => term.writeln('[DEBUG] ' + s);
                loader.info = (s) => term.writeln(s); // Isto mostra "Erasing", "Writing", etc.
                
                const chip = await loader.main_fn();
                term.writeln(`> CHIP DETECTED: ${chip}`);

                term.writeln('> ERASING FLASH...');
                await loader.erase_flash();

                // LOOP PELOS FICHEIROS (BOOTLOADER, PARTITIONS, APP)
                const parts = manifest.builds[0].parts;
                for (let part of parts) {
                    term.writeln(`> DOWNLOADING ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    term.writeln(`> WRITING ${bin.byteLength} BYTES AT ${part.offset}...`);
                    
                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (fileIndex, written, total) => {
                            const pct = Math.round((written / total) * 100);
                            document.getElementById('status').innerText = `Flashing: ${pct}%`;
                            // Opcional: Mostrar progresso no terminal
                            if (pct % 10 === 0) term.write('.');
                        }
                    });
                    term.writeln('\n> DONE.');
                }

                term.writeln('> RESETTING...');
                await loader.hard_reset();
                await port.close();
                term.writeln('\n> FLASH COMPLETE! SUCCESS.');
                document.getElementById('status').innerText = "Success";

            } catch (e) {
                term.writeln(`\n> ERROR: ${e.message}`);
                console.error(e);
                document.getElementById('status').innerText = "Error";
            }
        }
    </script>
</body>
</html>
