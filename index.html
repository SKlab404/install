<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ ESP32 REAL FLASHER w/ LOGS</title>
    <!-- ESPTOOL-JS (LOGS REAIS!) -->
    <script src="https://unpkg.com/@esphome/esptool-js@0.5.6/dist/esptool-js.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* O teu CSS Matrix cyberpunk aqui... (mantém igual) */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #00ff41; font-family: 'Orbitron', monospace; height: 100vh; display: flex; flex-direction: column; }
        
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }
        
        header { padding: 20px; border-bottom: 2px solid #00ff41; background: rgba(0,20,0,0.9); display: flex; justify-content: space-between; }
        .title { font-size: 28px; letter-spacing: 3px; text-shadow: 0 0 10px #00ff41; }
        
        main { flex: 1; padding: 30px; display: flex; gap: 30px; }
        
        .flash-panel { flex: 0 0 400px; background: rgba(0,10,0,0.8); padding: 25px; border: 1px solid #00ff41; }
        .log-panel { flex: 1; background: #000; border: 2px solid #333; display: flex; flex-direction: column; }
        
        .flash-btn {
            width: 100%; padding: 20px; margin: 15px 0; background: rgba(0,255,65,0.2);
            border: 2px solid #00ff41; color: #fff; font-family: 'Orbitron';
            font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .flash-btn:hover { box-shadow: 0 0 20px #00ff41; transform: scale(1.02); }
        
        .danger { border-color: #ff0055; background: rgba(255,0,85,0.2); }
        
        .log-header { background: #111; padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        #logTerminal {
            flex: 1; padding: 20px; font-family: 'VT323', monospace; font-size: 16px;
            overflow-y: auto; color: #00ff41; white-space: pre-wrap; background: #000;
        }
        .log-progress { color: #ffff00; font-weight: bold; }
        .log-error { color: #ff0055; }
        .log-success { color: #00ff41; }
        
        .connect-btn { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 10px; margin: 0 10px; }
        
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>
    <div id="intro-overlay" onclick="startSystem()">
        <div style="font-size: 48px; text-shadow: 0 0 20px #00ff41;">CYBER FLASHER</div>
        <div style="font-family: 'VT323'; font-size: 24px; margin-top: 20px;">CLICK TO BOOT</div>
    </div>

    <canvas id="matrix"></canvas>
    
    <header>
        <div class="title">🕷️ REAL ESPTOOL LOGS</div>
        <div id="status">READY</div>
    </header>

    <main>
        <!-- FLASH PANEL -->
        <div class="flash-panel">
            <h3 style="color: #fff; margin-bottom: 20px;">FIRMWARE DEPLOY</h3>
            
            <button class="flash-btn" onclick="flashFirmware('manifest_std.json')">
                <i class="fas fa-bug"></i> MARAUDER STD<br><small>ESP32 WROOM</small>
            </button>
            
            <button class="flash-btn" onclick="flashFirmware('manifest_c5.json')">
                <i class="fas fa-mobile-alt"></i> MARAUDER C5<br><small>M5STICK / PLUS</small>
            </button>
            
            <button class="flash-btn danger" onclick="flashFirmware('manifest_bruce.json')">
                <i class="fas fa-skull"></i> BRUCE REAPER<br><small>ESP32-S3 ONLY</small>
            </button>
        </div>

        <!-- LOG TERMINAL -->
        <div class="log-panel">
            <div class="log-header">
                <span><i class="fas fa-terminal"></i> ESPTOOL SERIAL LOG</span>
                <button class="connect-btn" id="connectSerial">CONNECT SERIAL</button>
            </div>
            <div id="logTerminal">
> Waiting for target connection...
> Hold BOOT button if needed
            </div>
            <div style="padding: 10px; background: #111; display: flex;">
                <input id="cmdInput" placeholder="Send command to ESP..." disabled>
                <button class="connect-btn" id="sendCmd" disabled>SEND</button>
                <button class="connect-btn" style="background: #666;" onclick="clearLog()">CLEAR</button>
            </div>
        </div>
    </main>

    <script>
        // MATRIX EFFECT (o teu código)
        const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/14)).fill(1);
        setInterval(() => {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#0F0'; ctx.font = '14px monospace';
            drops.forEach((y,i) => {
                ctx.fillText('01XYZ'[Math.random()*5|0], i*14, y*14);
                if(y*14 > canvas.height && Math.random()>0.975) drops[i]=0; drops[i]++;
            });
        }, 50);

        // INTRO
        function startSystem() { document.getElementById('intro-overlay').remove(); }

        // ESPTOOL-JS FLASHER (LOGS REAIS!)
        let esptool;
        async function flashFirmware(manifestUrl) {
            try {
                log('> Loading manifest: ' + manifestUrl, 'log-progress');
                const response = await fetch(manifestUrl);
                const manifest = await response.json();
                
                log('> Requesting serial port...', 'log-progress');
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                log('> Initializing esptool.js...', 'log-success');
                esptool = new EspTool(port);
                
                log('> Erasing flash...', 'log-progress');
                await esptool.connect();
                await esptool.eraseFlash();
                
                log('> Writing firmware: ' + manifest.builds[0].parts[0].path, 'log-progress');
                const firmware = await fetch(manifest.builds[0].parts[0].path).then(r => r.arrayBuffer());
                await esptool.writeFlash(manifest.builds[0].parts[0].offset, new Uint8Array(firmware));
                
                log('> Flash complete! Resetting device...', 'log-success');
                await esptool.hardReset();
                
            } catch (error) {
                log('> ERROR: ' + error.message, 'log-error');
            }
        }

        // SERIAL TERMINAL (REAL)
        let serialReader, serialWriter;
        document.getElementById('connectSerial').onclick = async () => {
            const btn = event.target;
            if (serialReader) {
                serialReader.cancel(); serialWriter?.close();
                btn.textContent = 'CONNECT SERIAL'; btn.style.background = '#00ff41';
                document.getElementById('cmdInput').disabled = true;
                return;
            }
            
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const decoder = new TextDecoderStream();
                port.readable.pipeTo(decoder.writable);
                serialReader = decoder.readable.getReader();
                
                const encoder = new TextEncoderStream();
                serialWriter = encoder.writable.getWriter();
                encoder.readable.pipeTo(port.writable);
                
                btn.textContent = 'DISCONNECT'; btn.style.background = '#ff0055';
                document.getElementById('cmdInput').disabled = false;
                document.getElementById('cmdInput').focus();
                
                // Read loop
                while (true) {
                    const { value, done } = await serialReader.read();
                    if (done) break;
                    log(value, 'log-rx');
                }
            } catch (e) { log('> SERIAL ERROR: ' + e, 'log-error'); }
        };

        document.getElementById('sendCmd').onclick = async () => {
            const cmd = document.getElementById('cmdInput').value;
            if (serialWriter && cmd) {
                await serialWriter.write(cmd + '\r\n');
                log('> TX: ' + cmd, 'log-tx');
                document.getElementById('cmdInput').value = '';
            }
        };

        function log(msg, className = '') {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = `[${new Date().toTimeString().split(' ')[0]}] ${msg}\n`;
            document.getElementById('logTerminal').appendChild(div);
            document.getElementById('logTerminal').scrollTop = document.getElementById('logTerminal').scrollHeight;
        }

        function clearLog() { document.getElementById('logTerminal').innerHTML = '> Terminal cleared.\n'; }
    </script>
</body>
</html>
