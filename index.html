<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Flasher</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css"/>
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0c1117;
    color:#00ffc8;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* MAIN CARD */
#card{
    border:1px solid #00ffc833;
    padding:40px;
    text-align:center;
}

button{
    padding:12px 25px;
    border:1px solid #00ffc8;
    background:transparent;
    color:#00ffc8;
    cursor:pointer;
}

button:hover{
    background:#002822;
}

/* TERMINAL OVERLAY */
#terminalOverlay{
    position:fixed;
    inset:0;
    background:#000000f0;
    display:none;
    flex-direction:column;
    padding:30px;
}

#term{
    flex:1;
    border:1px solid #00ffc833;
}

#closeBtn{
    margin-top:15px;
}
</style>
</head>
<body>

<div id="card">
    <h2>SKLAB404 Firmware Installer</h2>
    <button onclick="startFlash()">Install Firmware</button>
</div>

<!-- Hidden esp tool -->
<esp-web-install-button id="hiddenFlash" manifest="manifest_c5.json" style="display:none;"></esp-web-install-button>

<!-- Terminal Overlay -->
<div id="terminalOverlay">
    <div id="term"></div>
    <button id="closeBtn" onclick="closeTerminal()">Close</button>
</div>

<script>

/* TERMINAL SETUP */
const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ffc8',
        cursor:'#00ffc8'
    },
    fontSize:14,
    cursorBlink:true
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById("term"));

function startFlash(){
    document.getElementById("terminalOverlay").style.display="flex";
    fit.fit();

    term.clear();
    term.writeln("Initializing flashing process...\n");

    // Trigger real esp-web-tools click
    document.getElementById("hiddenFlash")
        .shadowRoot
        .querySelector("button")
        .click();
}

function closeTerminal(){
    document.getElementById("terminalOverlay").style.display="none";
}

/* CAPTURE LOGS */
const originalConsoleLog = console.log;

console.log = function(...args){

    const msg = args.join(" ");

    if(msg.includes("ESP32")){
        term.writeln("\n[DEVICE] " + msg);
    }

    if(msg.includes("Writing") || msg.includes("%") || msg.includes("Erasing")){
        term.writeln("> " + msg);
    }

    if(msg.includes("Hash of data verified") || msg.includes("Leaving...")){
        term.writeln("\n✓ FLASH COMPLETE");
    }

    originalConsoleLog.apply(console,args);
};

</script>

</body>
</html>
