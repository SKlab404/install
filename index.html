<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER INSTALLER</title>
    <!-- Carrega a ferramenta oficial, sem invenções -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { margin-bottom: 2rem; }
        .card { background: #222; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        
        esp-web-install-button {
            display: block;
            margin: 10px 0;
            --esp-tools-button-color: #00ff41; /* Verde Hacker */
            --esp-tools-button-text-color: #000;
        }
    </style>
</head>
<body>

    <h1>MARAUDER FLASHER</h1>

    <div class="card">
        <h3>ESCOLHE A VERSÃO</h3>
        
        <!-- Botão Oficial -->
        <esp-web-install-button 
            manifest="manifest_c5.json">
            <button slot="activate">INSTALL C5 (BETA)</button>
        </esp-web-install-button>

        <esp-web-install-button 
            manifest="manifest_std.json">
            <button slot="activate">INSTALL STD</button>
        </esp-web-install-button>

        <esp-web-install-button 
            manifest="manifest_bruce.json">
            <button slot="activate" style="background:red; color:white;">INSTALL BRUCE</button>
        </esp-web-install-button>

        <p style="font-size:0.8em; color:#888; margin-top:20px;">
            DICA: No popup, clica em "LOGS" para ver o progresso real.
        </p>
    </div>

</body>
</html>
