<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<script type="module">
import { install } from "https://unpkg.com/esp-web-tools@10/dist/web/install.js?module";

window.runInstall = async function() {
    try {
        await install({
            manifest: "manifest_c5.json"
        });
    } catch (e) {
        console.error(e);
    }
};
</script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:black;
    overflow:hidden;
    font-family:monospace;
}
#term{
    width:100%;
    height:100vh;
    padding:20px;
}
#flashBtn{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:#002200;
    color:#00ff00;
    border:2px solid #00ff00;
    padding:15px 40px;
    font-family:monospace;
    font-size:16px;
    cursor:pointer;
}
#flashBtn:hover{
    background:#003300;
}
</style>
</head>
<body>

<div id="term"></div>
<button id="flashBtn">AUTHORIZE FLASH</button>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function intro(){
    term.writeln("\x1b[1;32mSKLAB404 Secure Terminal\x1b[0m");
    term.writeln("");
    await sleep(500);
    term.writeln("> Initializing...");
    await sleep(800);
    term.writeln("> Ready.");
    term.writeln("");
    term.writeln("\x1b[1;33mPress AUTHORIZE FLASH to continue.\x1b[0m");
}

intro();

document.getElementById("flashBtn").addEventListener("click", async () => {
    term.writeln("\n> Requesting serial access...");
    await window.runInstall();
});

</script>

</body>
</html>
