<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARAUDER BASE V38</title>
    
    <!-- 1. COMPONENTE OFICIAL (MOTOR) -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <!-- 2. TERMINAL (MONITOR) -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        /* BASE VISUAL SIMPLES */
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
        
        #controls { 
            padding: 20px; background: #111; border-bottom: 1px solid #333; 
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }

        /* Botões Personalizados (Para substituir o estilo padrão) */
        esp-web-install-button button {
            background: #003300 !important; color: white !important; 
            border: 1px solid #0f0 !important; padding: 10px 20px !important;
            font-family: monospace !important; font-weight: bold !important; cursor: pointer !important;
        }
        esp-web-install-button button:hover { background: #005500 !important; }

        #terminal-box { flex: 1; padding: 10px; position: relative; }
    </style>
</head>
<body>

    <div id="controls">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">FLASH STD</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:red !important;">FLASH BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="terminal-box"></div>

    <script>
        // 1. INICIAR TERMINAL
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('terminal-box'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER FLASHER BASE (V38) ===');
        term.writeln('> Pronto. Clica num botão acima.');

        // 2. CAPTURAR LOGS PARA O TERMINAL
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args); // Deixa o browser ver também
            
            // Converte tudo para texto e envia para o terminal
            const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
            
            // Filtra só o que interessa (limpeza visual)
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(msg);
            }
        };

        // 3. DETETAR SUCESSO
        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                if (e.detail.state === 'SUCCESS') {
                    term.writeln('\n\x1b[1;32m> SUCESSO! Instalação concluída.\x1b[0m');
                }
            });
        });
    </script>
</body>
</html>
