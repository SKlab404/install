<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER TERMINAL V13</title>
    
    <!-- XTERM (Terminal Visual) -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <!-- ESPTOOL (Bundle Global Correto) -->
    <script src="https://unpkg.com/esptool-js/bundle.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; margin: 0; display: flex; flex-direction: column; }
        
        #header { padding: 10px; background: #111; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; justify-content: center; }
        
        button { 
            padding: 10px 20px; background: #003300; color: #0f0; border: 1px solid #0f0; 
            font-family: monospace; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #005500; }
        button:disabled { background: #222; color: #555; border-color: #444; }

        #terminal { flex: 1; padding: 10px; }
        
        #status-bar { padding: 5px; background: #222; text-align: center; color: #aaa; font-size: 0.8em; }
    </style>
</head>
<body>

    <div id="header">
        <strong>MARAUDER V13</strong>
        <button onclick="flash('manifest_c5.json')">FLASH C5</button>
        <button onclick="flash('manifest_std.json')">FLASH STD</button>
        <button onclick="flash('manifest_bruce.json')" style="color:#ff5555; border-color:#ff5555">FLASH BRUCE</button>
        <button onclick="location.reload()" style="margin-left:auto; background:#333; border-color:#666;">RESET PAGE</button>
    </div>

    <div id="terminal"></div>
    <div id="status-bar">Waiting for user input...</div>

    <script>
        // 1. Setup Terminal
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();

        term.writeln('=== MARAUDER FLASHER V13 ===');
        term.writeln('> Checking libraries...');

        // 2. Verificar biblioteca
        if (typeof esptooljs === 'undefined') {
            term.writeln('\x1b[1;31m> ERROR: esptool-js library not loaded!\x1b[0m');
            term.writeln('> Try disabling AdBlock or checking internet connection.');
        } else {
            term.writeln('\x1b[1;32m> LIBRARY OK. READY TO FLASH.\x1b[0m');
        }

        async function flash(manifestUrl) {
            try {
                if (typeof esptooljs === 'undefined') return alert("Library missing!");

                term.writeln(`\n> [INIT] Fetching ${manifestUrl}...`);
                const resp = await fetch(manifestUrl);
                const manifest = await resp.json();

                term.writeln('> [USER] Select Serial Port...');
                
                let port;
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                } catch (err) {
                    if (err.message.includes("already open")) {
                        term.writeln('\x1b[1;31m> ERROR: PORT LOCKED! PLEASE RELOAD PAGE (F5) OR UNPLUG USB.\x1b[0m');
                        alert("PORTA BLOQUEADA! Faz refresh à página (F5) e tenta de novo.");
                    } else {
                        term.writeln(`> ERROR: ${err.message}`);
                    }
                    return;
                }

                term.writeln('> [CONN] Connecting to ESP32...');
                
                // CORREÇÃO: Usar 'esptooljs.Transport' em vez de apenas 'Transport'
                const transport = new esptooljs.Transport(port);
                const loader = new esptooljs.ESPLoader(transport, 115200, null);

                // Logs visíveis
                loader.debug = (s) => term.writeln(`  [DBG] ${s}`);
                loader.info = (s) => term.writeln(`  [INF] ${s}`);

                const chip = await loader.main_fn();
                term.writeln(`> [INFO] Connected to ${chip}`);

                term.writeln('> [WIPE] Erasing Flash...');
                await loader.erase_flash();

                const parts = manifest.builds[0].parts;
                for (let part of parts) {
                    term.writeln(`> [DL] Downloading ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    term.writeln(`> [WRITE] Writing to 0x${part.offset.toString(16)}...`);
                    
                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (fileIndex, written, total) => {
                            const pct = Math.round((written / total) * 100);
                            document.getElementById('status-bar').innerText = `Flashing: ${pct}%`;
                            if (pct % 5 === 0) term.write('.');
                        }
                    });
                    term.write(' OK');
                }

                term.writeln('\n> [RESET] Hard Resetting...');
                await loader.hard_reset();
                await port.close();

                term.writeln('\n\x1b[1;32m> ✅ SUCCESS! ENJOY YOUR MARAUDER.\x1b[0m');
                document.getElementById('status-bar').innerText = "DONE";

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> CRITICAL ERROR: ${e.message}\x1b[0m`);
                console.error(e);
            }
        }
    </script>
</body>
</html>
