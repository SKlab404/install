<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:black;
    font-family:monospace;
    color:#00ff00;
}

/* TERMINAL */
#term{
    width:100%;
    height:100vh;
    padding:20px;
    position:relative;
    z-index:1;
}

/* BOTÃO */
#flashArea{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999; /* 🔥 FORÇA FICAR POR CIMA */
}

.cyberBtn{
    background:#002200 !important;
    color:#00ff00 !important;
    border:2px solid #00ff00 !important;
    padding:15px 40px !important;
    font-family:monospace !important;
    font-size:16px !important;
    cursor:pointer !important;
    box-shadow:0 0 15px #00ff00 !important;
}
.cyberBtn:hover{
    background:#003300 !important;
    box-shadow:0 0 25px #00ff00 !important;
}
</style>
</head>
<body>

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cyberBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function intro(){
    term.writeln("\x1b[1;32mSKLAB404 Secure Terminal\x1b[0m");
    term.writeln("");
    await sleep(500);
    term.writeln("> Initializing environment...");
    await sleep(800);
    term.writeln("> Ready.");
    term.writeln("");
    term.writeln("\x1b[1;33mPress AUTHORIZE FLASH to begin.\x1b[0m");
}

intro();

document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("> Flashing firmware...");
    }
    else if(e.detail.state==="SUCCESS"){
        term.writeln("\x1b[1;32m✓ Flash complete\x1b[0m");
    }
    else if(e.detail.state==="ERROR"){
        term.writeln("\x1b[1;31m✗ "+e.detail.error+"\x1b[0m");
    }
});

</script>

</body>
</html>
