<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 // Professional Flasher</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0c1311;
    font-family:monospace;
    color:#00ff9d;
}

header{
    padding:20px 40px;
    border-bottom:1px solid #00ff9d22;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#main{
    display:flex;
    padding:40px;
    gap:40px;
}

/* LEFT PANEL */
#config{
    width:300px;
}

.card{
    border:1px solid #00ff9d33;
    padding:20px;
    margin-bottom:20px;
}

select, input{
    width:100%;
    background:#001a12;
    color:#00ff9d;
    border:1px solid #00ff9d22;
    padding:6px;
    margin-top:8px;
}

/* FLASH AREA */
#flashArea{
    flex:1;
}

#term{
    width:100%;
    height:350px;
    background:#000000ee;
    border:1px solid #00ff9d55;
}

#progressContainer{
    width:100%;
    height:20px;
    background:#001a12;
    margin-top:10px;
    display:none;
}

#progressBar{
    height:100%;
    width:0%;
    background:#00ff9d;
    transition:width 0.2s;
}

button{
    margin-top:10px;
    padding:8px 15px;
    background:transparent;
    border:1px solid #00ff9d;
    color:#00ff9d;
    cursor:pointer;
}

#status{
    margin-top:10px;
    font-size:0.9rem;
    opacity:0.8;
}
</style>
</head>
<body>

<header>
    <h2>SKLAB404 Professional Flasher</h2>
    <div id="status">Idle</div>
</header>

<div id="main">

<!-- CONFIG PANEL -->
<div id="config">

<div class="card">
<label>Device Firmware</label>
<select id="firmwareSelect">
<option value="manifest_c5.json">ESP32-C5</option>
<option value="manifest_c3.json">ESP32-C3</option>
<option value="manifest_s3.json">ESP32-S3</option>
</select>
</div>

<div class="card">
<label>Baud Rate</label>
<select id="baudSelect">
<option value="115200">115200</option>
<option value="460800">460800</option>
<option value="921600">921600</option>
</select>
</div>

<div class="card">
<button onclick="forceReset()">Force Reset</button>
</div>

</div>

<!-- FLASH AREA -->
<div id="flashArea">

<div id="flashContainer">
<esp-web-install-button id="flashBtn"></esp-web-install-button>
</div>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<div id="term"></div>

</div>

</div>

<script>

let lastActivity = Date.now();
let watchdog = null;

/* TERMINAL */
const term = new Terminal({
theme:{background:'transparent',foreground:'#00ff9d',cursor:'#00ff9d'},
fontSize:14,
cursorBlink:true
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();

/* APPLY FIRMWARE SELECTION */
document.getElementById("firmwareSelect").addEventListener("change", e=>{
document.getElementById("flashBtn").setAttribute("manifest", e.target.value);
});

/* INIT DEFAULT */
document.getElementById("flashBtn").setAttribute(
"manifest",
document.getElementById("firmwareSelect").value
);

/* WATCHDOG */
function startWatchdog(){
clearInterval(watchdog);
watchdog = setInterval(()=>{
if(Date.now() - lastActivity > 20000){
term.writeln("\n⚠ Flash stalled. Resetting...");
forceReset();
}
},5000);
}

function stopWatchdog(){
clearInterval(watchdog);
}

/* FORCE RESET */
function forceReset(){
stopWatchdog();
const container = document.getElementById("flashContainer");
const old = document.getElementById("flashBtn");
const clone = old.cloneNode(true);
container.innerHTML="";
container.appendChild(clone);
document.getElementById("progressBar").style.width="0%";
document.getElementById("progressContainer").style.display="none";
document.getElementById("status").innerText="Reset complete";
}

/* LOG CAPTURE */
const originalConsoleLog = console.log;

console.log = function (...args){

const msg = args.join(" ");
lastActivity = Date.now();

if(msg.includes("ESP32")){
term.writeln("[DEVICE] " + msg);
document.getElementById("status").innerText = msg;
}

if(msg.includes("Writing") || msg.includes("%")){
term.writeln("> " + msg);

const match = msg.match(/(\d+)%/);
if(match){
document.getElementById("progressContainer").style.display="block";
document.getElementById("progressBar").style.width = match[1] + "%";
}
}

if(msg.includes("Connecting")){
document.getElementById("status").innerText="Connecting...";
startWatchdog();
}

if(msg.includes("Hash of data verified") || msg.includes("Leaving...")){
stopWatchdog();
document.getElementById("status").innerText="Flash complete";
}

originalConsoleLog.apply(console,args);
};

</script>
</body>
</html>
