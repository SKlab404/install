<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SKLAB404 V55</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #0f0; 
            font-family: monospace; 
            height: 100vh; 
            overflow: hidden;
            position: relative;
        }

        /* SPLASH FULLSCREEN SUAVE */
        #splash {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #001122 0%, #000000 70%);
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            z-index: 100; 
            cursor: pointer;
            transition: all 1s ease-out;
        }
        #splash.fade-out {
            opacity: 0; transform: scale(1.1); pointer-events: none;
        }
        #splash h1 { 
            font-size: 4em; margin-bottom: 30px; 
            text-shadow: 0 0 40px #0f0, 0 0 60px #0f0;
            animation: pulse 2s infinite;
        }
        #splash p { 
            font-size: 1.4em; opacity: 0.9; 
            text-shadow: 0 0 20px #0f0;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* APP (aparece suave) */
        #app { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            opacity: 0; transform: translateY(50px);
            transition: all 1s ease-out 0.3s;
        }
        #app.show { opacity: 1; transform: translateY(0); }

        #header { padding: 25px; background: rgba(17,17,17,0.95); text-align: center; border-bottom: 1px solid #333; backdrop-filter: blur(10px); }
        #controls { padding: 25px; background: rgba(17,17,17,0.9); text-align: center; border-bottom: 1px solid #333; backdrop-filter: blur(10px); }
        esp-web-install-button button { 
            background: linear-gradient(45deg, #004400, #006600) !important; 
            color: #fff !important; border: 2px solid #0f0 !important; 
            padding: 16px 32px !important; font-weight: bold !important; 
            cursor: pointer !important; font-family: monospace !important; 
            border-radius: 8px !important; box-shadow: 0 0 20px rgba(0,255,0,0.3) !important;
            transition: all 0.3s !important;
        }
        esp-web-install-button button:hover { 
            box-shadow: 0 0 30px #0f0 !important; transform: scale(1.05) !important;
        }
        esp-web-install-button { --esp-tools-card-background-color: transparent !important; margin: 0 15px; display: inline-block; }
        #term { flex: 1; padding: 20px; background: rgba(0,0,0,0.95); }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div id="splash" onclick="enter()">
        <h1>SKLAB404</h1>
        <p>Click para intro + installer</p>
    </div>

    <!-- APP -->
    <div id="app">
        <div id="header">
            <h2>INSTALLER</h2>
            <div style="opacity: 0.7; font-size: 0.9em;">Ready</div>
        </div>
        <div id="controls">
            <esp-web-install-button manifest="manifest_c5.json">
                <button slot="activate">🧠 C5</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_std.json">
                <button slot="activate">⚡ STD</button>
            </esp-web-install-button>
            <esp-web-install-button manifest="manifest_bruce.json">
                <button slot="activate">🔥 BRUCE</button>
            </esp-web-install-button>
        </div>
        <div id="term"></div>
    </div>

    <script>
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();

        function enter() {
            // Fade out splash suave
            document.getElementById('splash').classList.add('fade-out');
            
            // TOCA INTRO
            const intro = new Audio("https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3");
            intro.volume = 0.6;
            intro.play();
            
            // Mostra app suave
            setTimeout(() => {
                document.getElementById('app').classList.add('show');
                term.writeln('\n\x1b[1;32m> Intro completa ✓\n> Installer ready ✓\x1b[0m');
            }, 500);
        }

        // LOGS
        console.log = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        // SUCESSO
        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                const name = b.querySelector('button').textContent;
                if (e.detail.state === 'INSTALLING') term.writeln(`\n>>> ${name}`);
                else if (e.detail.state === 'SUCCESS') term.writeln('\n\x1b[1;32m✓ SUCESSO!\x1b[0m');
                else if (e.detail.state === 'ERROR') {
                    if (e.detail.error.includes('Improv')) {
                        term.writeln('\n\x1b[1;32m✓ SUCESSO! (skip)\x1b[0m');
                    } else {
                        term.writeln(`\n\x1b[1;31m✗ ${e.detail.error}\x1b[0m`);
                    }
                }
            });
        });
    </script>
</body>
</html>
