<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V17 (FINAL FIX)</title>
    
    <!-- TERMINAL VISUAL (XTERM) -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        
        #top-bar { 
            padding: 15px; background: #111; border-bottom: 2px solid #333; 
            display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap;
        }
        
        button { 
            padding: 12px 20px; background: #002200; color: #0f0; border: 1px solid #0f0; 
            font-family: monospace; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #004400; box-shadow: 0 0 10px #0f0; }
        button:disabled { background: #222; color: #555; border-color: #444; cursor: not-allowed; box-shadow: none; }
        
        #terminal-box { flex: 1; padding: 10px; position: relative; }
    </style>
</head>
<body>

    <div id="top-bar">
        <strong>V17</strong>
        <button id="btn-c5" onclick="startFlash('manifest_c5.json')" disabled>A CARREGAR...</button>
        <button id="btn-std" onclick="startFlash('manifest_std.json')" disabled>A CARREGAR...</button>
        <button id="btn-bruce" onclick="startFlash('manifest_bruce.json')" disabled style="color:#f55; border-color:#f55">BRUCE</button>
        <button onclick="location.reload()" style="background:#333; border-color:#555">RESET</button>
    </div>

    <div id="terminal-box"></div>

    <!-- CARREGAMENTO DA LIB (MODERNO) -->
    <script type="module">
        import * as esptool from 'https://unpkg.com/esptool-js@0.5.4/lib/index.js?module';
        window.esptool = esptool;
        window.libReady = true;
        
        if (window.term) {
            window.term.writeln('\x1b[1;32m> SUCESSO: Biblioteca carregada (v0.5.4).\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        // 1. SETUP TERMINAL
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-box'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();
        window.term = term;

        term.writeln('=== MARAUDER V17 (CORREÇÃO DE PROTOCOLO) ===');
        term.writeln('> A aguardar biblioteca...');

        // Loop de verificação
        const checkLib = setInterval(() => {
            if (window.libReady) {
                clearInterval(checkLib);
                enableButtons();
            }
        }, 500);

        function enableButtons() {
            if (document.getElementById('btn-c5').disabled === false) return;
            document.querySelectorAll('button:not(:last-child)').forEach(b => {
                b.disabled = false;
                b.innerText = b.innerText.replace("A CARREGAR...", "FLASH");
            });
        }

        // 2. FUNÇÃO FLASH (CORRIGIDA PARA NOVA API)
        async function startFlash(manifestUrl) {
            if (!window.libReady) return alert("Erro: Lib não carregada.");

            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            let port;
            try {
                term.writeln(`\n> [GET] A ler ${manifestUrl}...`);
                const resp = await fetch(manifestUrl);
                if (!resp.ok) throw new Error("Manifesto não encontrado");
                const manifest = await resp.json();

                term.writeln('> [USB] Seleciona a porta Serial...');
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                term.writeln('> [LINK] A conectar ao ESP32...');

                // *** O SEGREDO: ADAPTADOR PARA O TERMINAL ***
                const terminalAdapter = {
                    clean: () => term.clear(),
                    writeLine: (data) => term.writeln(data),
                    write: (data) => term.write(data)
                };

                const transport = new window.esptool.Transport(port);
                
                // *** CORREÇÃO CRÍTICA: PASSAR COMO OBJETO ***
                const loader = new window.esptool.ESPLoader({
                    transport: transport,
                    baudrate: 115200, // IMPORTANTE: baudrate minúsculo na nova versão
                    terminal: terminalAdapter
                });

                const chip = await loader.main_fn();
                term.writeln(`> [INFO] Chip detetado: \x1b[1;37m${chip}\x1b[0m`);

                term.writeln('> [WIPE] A apagar Flash (Pode demorar)...');
                await loader.erase_flash();

                const parts = manifest.builds[0].parts;
                for (let part of parts) {
                    term.writeln(`> [DOWN] A obter ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    term.writeln(`> [BURN] A escrever a 0x${part.offset.toString(16)}...`);
                    
                    const fileData = new Uint8Array(bin);
                    
                    await loader.write_flash({
                        fileArray: [{ data: fileData, address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (fileIndex, written, total) => {
                            const pct = Math.round((written / total) * 100);
                            // O próprio loader já escreve o progresso no terminalAdapter!
                            // Não precisamos de duplicar aqui.
                        }
                    });
                }

                term.writeln('\n> [RESET] Reiniciando dispositivo...');
                await loader.hard_reset();
                
                term.writeln('\n\x1b[1;32m> ✅ SUCESSO TOTAL! Podes desligar.\x1b[0m');

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
                console.error(e);
                if (e.message.includes("already open")) alert("Porta bloqueada! Faz refresh (F5).");
            } finally {
                if (port) await port.close(); // Tentar fechar a porta
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
