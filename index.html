<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V15 (CLOUDFLARE)</title>
    <!-- XTERM -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/xterm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/3.14.5/addons/fit/fit.min.js"></script>

    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #controls { padding: 15px; background: #222; border-bottom: 1px solid #444; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; background: #000; color: #0f0; border: 1px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #003300; }
        #terminal { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="flash('manifest_c5.json')">FLASH C5</button>
        <button onclick="flash('manifest_std.json')">FLASH STD</button>
        <button onclick="flash('manifest_bruce.json')" style="color:red; border-color:red">FLASH BRUCE</button>
    </div>

    <div id="terminal"></div>

    <!-- TENTATIVA 1: Carregar via Módulo (Moderno) -->
    <script type="module">
        import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js@0.5.4/lib/index.js?module';
        window.ESPLoader = ESPLoader;
        window.Transport = Transport;
        console.log("Módulo carregado via UNPKG");
    </script>

    <script>
        // Configurar Terminal
        const term = new Terminal({ cursorBlink: true });
        term.open(document.getElementById('terminal'));
        term.fit();
        
        term.writeln('=== MARAUDER V15 ===');
        term.writeln('> Tentando carregar bibliotecas...');

        async function flash(manifestUrl) {
            // VERIFICAÇÃO DE SEGURANÇA
            if (!window.ESPLoader) {
                term.writeln('\x1b[1;31m> ERRO: A biblioteca ainda não chegou!\x1b[0m');
                term.writeln('> Solucao:');
                term.writeln('  1. Espera 5 segundos e tenta de novo.');
                term.writeln('  2. Se falhar, usa o "Botao Azul" oficial.');
                return;
            }

            try {
                term.writeln(`\n> A ler ${manifestUrl}...`);
                const resp = await fetch(manifestUrl);
                const manifest = await resp.json();

                term.writeln('> Escolhe a porta USB...');
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                term.writeln('> A conectar...');
                const transport = new window.Transport(port);
                const loader = new window.ESPLoader(transport, 115200, null);

                // LOGS
                loader.debug = (s) => term.writeln('  ' + s);
                loader.info = (s) => term.writeln('  ' + s);

                await loader.main_fn();
                term.writeln('> APAGANDO FLASH (Espera!)...');
                await loader.erase_flash();

                const parts = manifest.builds[0].parts;
                for (let part of parts) {
                    term.writeln(`> A escrever ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (fileIndex, written, total) => {
                             // Progresso minimalista para não travar
                             if (written % 50000 < 2000) term.write('.');
                        }
                    });
                    term.writeln(' OK');
                }

                await loader.hard_reset();
                await port.close();
                term.writeln('\n> SUCESSO! Podes desligar.');

            } catch (e) {
                term.writeln(`\n> ERRO: ${e.message}`);
            }
        }
    </script>
</body>
</html>
