<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Universal Flasher</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0b1110;
    font-family:monospace;
    overflow:hidden;
    color:#8affc1;
}

/* SPLASH */
#splash{
    position:fixed;
    width:100%;
    height:100%;
    background:#0b1110;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
    transition:0.5s;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}

/* TERMINAL */
#term{
    position:fixed;
    width:100%;
    height:100%;
}

/* BUTTON AREA */
#buttons{
    position:fixed;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:none;
}

.cleanBtn{
    background:transparent !important;
    color:#8affc1 !important;
    border:1px solid #8affc1 !important;
    padding:12px 30px !important;
    font-size:14px !important;
    letter-spacing:2px;
    cursor:pointer !important;
    margin:5px;
}
.cleanBtn:hover{
    background:#13201c !important;
}

/* SUCCESS SCREEN */
#successScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#0b1110;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:2000;
    text-align:center;
}

#successScreen img{
    width:180px;
    margin-bottom:25px;
}

#successScreen h2{
    color:#8affc1;
    letter-spacing:3px;
}

#successScreen p{
    opacity:0.7;
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Universal ESP Flasher</p>
</div>

<!-- TERMINAL -->
<div id="term"></div>

<!-- BUTTONS -->
<div id="buttons">

    <esp-web-install-button id="connectBtn" manifest="manifest_c5.json">
        <button slot="activate" class="cleanBtn">CONNECT DEVICE</button>
    </esp-web-install-button>

    <esp-web-install-button id="btnC5" manifest="manifest_c5.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-C5</button>
    </esp-web-install-button>

    <esp-web-install-button id="btnC3" manifest="manifest_c3.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-C3</button>
    </esp-web-install-button>

    <esp-web-install-button id="btnS3" manifest="manifest_s3.json">
        <button slot="activate" class="cleanBtn">FLASH ESP32-S3</button>
    </esp-web-install-button>

</div>

<!-- SUCCESS SCREEN -->
<div id="successScreen">
    <!-- Logo teste -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Checkmark_green.svg">
    <h2>FLASH SUCCESSFUL</h2>
    <p>Device programmed successfully</p>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'transparent',
        foreground:'#8affc1',
        cursor:'#8affc1'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(text, delay=30){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

function enter(){

    document.getElementById("splash").classList.add("fade");

    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.4;
    intro.play().catch(()=>{});

    setTimeout(startSequence,500);
}

async function startSequence(){

    await type("Initializing universal flashing utility...");
    await sleep(400);
    await type("Press CONNECT DEVICE to detect ESP...");
    document.getElementById("buttons").style.display="block";

    document.getElementById("btnC5").style.display="none";
    document.getElementById("btnC3").style.display="none";
    document.getElementById("btnS3").style.display="none";
}

/* CAPTURE LOGS */
const originalConsoleLog = console.log;

console.log = function (...args) {
    const msg = args.join(" ");

    // Detectar modelo
    if (msg.includes("ESP32-C5")) {
        term.writeln("\n[DEVICE] ESP32-C5 detected");
        document.getElementById("btnC5").style.display="inline-block";
    }

    if (msg.includes("ESP32-C3")) {
        term.writeln("\n[DEVICE] ESP32-C3 detected");
        document.getElementById("btnC3").style.display="inline-block";
    }

    if (msg.includes("ESP32-S3")) {
        term.writeln("\n[DEVICE] ESP32-S3 detected");
        document.getElementById("btnS3").style.display="inline-block";
    }

    // Progresso real
    if (
        msg.includes("Writing") ||
        msg.includes("%") ||
        msg.includes("Erasing")
    ) {
        term.writeln("> " + msg);
    }

    // 🔥 DETETAR FIM REAL DO FLASH
    if (
        msg.includes("Hash of data verified") ||
        msg.includes("Leaving...")
    ) {

        document.getElementById("buttons").style.display="none";
        document.getElementById("successScreen").style.display="flex";
    }

    originalConsoleLog.apply(console, args);
};


/* STATE EVENTS */
document.querySelectorAll("esp-web-install-button")
.forEach(btn => {

    btn.addEventListener("state-change", (e) => {

        if (e.detail.state === "INSTALLING") {
            term.writeln("\n> Flashing firmware...");
        }

        if (e.detail.state === "SUCCESS") {

            // Hide firmware buttons
            document.getElementById("btnC5").style.display="none";
            document.getElementById("btnC3").style.display="none";
            document.getElementById("btnS3").style.display="none";
            document.getElementById("buttons").style.display="none";

            // Show success screen
            document.getElementById("successScreen").style.display="flex";
        }

        if (e.detail.state === "ERROR") {
            term.writeln("\n✗ " + e.detail.error);
        }

    });

});

</script>

</body>
</html>
