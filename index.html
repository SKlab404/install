<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER FLASHER PRO</title>
    <!-- Xterm (Terminal) -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        #sidebar { width: 300px; background: #111; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        #terminal-container { flex: 1; position: relative; background: #000; padding: 10px; }
        #terminal { width: 100%; height: 100%; }
        
        button {
            padding: 15px; background: #003300; color: #0f0; border: 1px solid #0f0; 
            cursor: pointer; font-family: monospace; text-align: left; font-size: 14px;
        }
        button:hover { background: #005500; }
        
        /* Barra de Progresso Customizada */
        #progress-bar {
            position: absolute; bottom: 0; left: 0; height: 5px; 
            background: #00ff41; width: 0%; transition: width 0.2s;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color:#fff; text-align:center;">MARAUDER</h2>
        <button id="btnConnect">1. CONNECT SERIAL</button>
        <hr style="width:100%; border-color:#333;">
        <button id="btnFlashC5">2. FLASH C5 (BETA)</button>
        <button id="btnFlashStd">2. FLASH STD</button>
        <button id="btnFlashBruce" style="border-color:red; color:red;">2. FLASH BRUCE</button>
        <hr style="width:100%; border-color:#333;">
        <button id="btnReset">3. RESET BOARD</button>
        <div style="margin-top:auto; font-size:12px; color:#666;">Status: <span id="status">Idle</span></div>
    </div>

    <div id="terminal-container">
        <div id="terminal"></div>
        <div id="progress-bar"></div>
    </div>

    <!-- MÓDULO PRINCIPAL -->
    <script type="module">
        import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js@0.4.6/lib/index.js';

        let esploader;
        let transport;
        let device = null;

        // Terminal Setup
        const term = new Terminal({ theme: { background: '#000', foreground: '#00ff41' }, fontFamily: 'Courier New', fontSize: 14 });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();

        function log(msg) { term.writeln(msg); }
        term.writeln('> SYSTEM READY. CONNECT SERIAL FIRST.');

        // 1. CONNECT SERIAL
        document.getElementById('btnConnect').onclick = async () => {
            if (device) { await device.close(); device = null; term.writeln('> DISCONNECTED.'); return; }
            try {
                device = await navigator.serial.requestPort();
                transport = new Transport(device);
                term.writeln('> SERIAL PORT SELECTED.');
                
                // Modo Monitor (Log output)
                await device.open({ baudRate: 115200 });
                term.writeln('> CONNECTED (MONITOR MODE).');
                
                // Leitura contínua
                while (device.readable && !transport.in_progress) { // Hack simples
                    const reader = device.readable.getReader();
                    try {
                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            term.write(new TextDecoder().decode(value));
                        }
                    } catch (error) { break; } 
                    finally { reader.releaseLock(); }
                }

            } catch (e) { term.writeln(`> ERROR: ${e.message}`); }
        };

        // 2. FLASH FUNCTION
        async function flash(manifestUrl) {
            if (!device) return term.writeln('> ERROR: Connect Serial First!');
            
            try {
                await device.close(); // Fecha modo monitor para abrir modo flash
                await device.open({ baudRate: 115200 });

                term.writeln(`\n> LOADING ${manifestUrl}...`);
                const resp = await fetch(manifestUrl);
                const manifest = await resp.json();

                term.writeln('> CONNECTING TO BOOTLOADER...');
                esploader = new ESPLoader(transport, 115200, null);
                
                // Redireciona logs internos da lib para o xterm
                // NOTA: v0.4.6 nao tem logger callback publico facil, mas vamos tentar
                
                const chip = await esploader.main_fn();
                term.writeln(`> CHIP DETECTED: ${chip}`);

                term.writeln('> ERASING FLASH...');
                await esploader.erase_flash();

                // Loop pelos ficheiros do manifest (Suporta Multi-File!)
                const parts = manifest.builds[0].parts;
                for (let part of parts) {
                    term.writeln(`> DOWNLOADING ${part.path}...`);
                    const bin = await fetch(part.path).then(r => r.arrayBuffer());
                    
                    term.writeln(`> WRITING ${bin.byteLength} BYTES AT 0x${part.offset.toString(16)}...`);
                    
                    await esploader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (fileIndex, written, total) => {
                            const pct = Math.round((written / total) * 100);
                            document.getElementById('progress-bar').style.width = pct + '%';
                            document.getElementById('status').innerText = `Flashing: ${pct}%`;
                        }
                    });
                    term.writeln(`> DONE: ${part.path}`);
                }

                term.writeln('> RESETTING...');
                await esploader.hard_reset();
                term.writeln('> FLASH COMPLETE! RECONNECTING MONITOR...');
                
                // Re-conectar monitor seria complexo aqui, melhor pedir ao user para clicar Connect de novo

            } catch (e) {
                term.writeln(`> ERROR: ${e.message}`);
                console.error(e);
            }
        }

        document.getElementById('btnFlashC5').onclick = () => flash('manifest_c5.json');
        document.getElementById('btnFlashStd').onclick = () => flash('manifest_std.json');
        
        // 3. RESET
        document.getElementById('btnReset').onclick = async () => {
             if(esploader) await esploader.hard_reset();
        };

    </script>
</body>
</html>
