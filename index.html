<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 CYBER TERMINAL</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:black;
    font-family:monospace;
    color:#00ff00;
    overflow:hidden;
}

/* TERMINAL */
#term{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* BOTÃO */
#flashArea{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000; /* acima do terminal */
}

.cyberBtn{
    background:#002200 !important;
    color:#00ff00 !important;
    border:2px solid #00ff00 !important;
    padding:15px 40px !important;
    font-size:16px !important;
    cursor:pointer !important;
}
</style>
</head>
<body>

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cyberBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff00',
        cursor:'#00ff00'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

term.writeln("SKLAB404 Secure Terminal");
term.writeln("");
term.writeln("> System ready.");
term.writeln("> Press AUTHORIZE FLASH to begin.");

/* PROGRESSO REAL */
const originalConsoleLog = console.log;
console.log = function (...args) {
    const msg = args.join(" ");
    if (msg.includes("Writing") || msg.includes("%") || msg.includes("Erasing")) {
        term.writeln("> " + msg);
    }
    originalConsoleLog.apply(console, args);
};

document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("> Flashing firmware...");
    }
    if(e.detail.state==="SUCCESS"){
        term.writeln("✓ Flash complete");
    }
    if(e.detail.state==="ERROR"){
        term.writeln("✗ " + e.detail.error);
    }
});

</script>

</body>
</html>
