<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V35 (CUSTOM UI)</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        
        #header { 
            padding: 20px; background: #050505; border-bottom: 2px solid #003300; 
            display: flex; justify-content: center; gap: 20px;
        }
        
        /* Estilo dos Botões */
        esp-web-install-button button {
            padding: 15px 30px !important; 
            background: #002200 !important; 
            color: #0f0 !important; 
            border: 1px solid #0f0 !important; 
            font-family: 'Courier New', monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            cursor: pointer !important;
            transition: 0.2s;
        }
        esp-web-install-button button:hover {
            background: #004400 !important;
            box-shadow: 0 0 15px #0f0;
        }

        #term-container { 
            flex: 1; padding: 20px; background: #000; 
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <div id="header">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">FLASH STD</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:#f00 !important; color:#f00 !important;">FLASH BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="term-container"></div>

    <script>
        // 1. TERMINAL
        const term = new Terminal({ 
            theme: { background: '#000', foreground: '#0f0', cursor: '#0f0' }, 
            cursorBlink: true, fontSize: 14, fontFamily: 'Courier New' 
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term-container'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER SYSTEM READY ===');
        term.writeln('> Aguardando comando...');

        // 2. INTERCETAR LOGS (O TEU PEDIDO)
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args); // Mantém funcionalidade original
            
            const msg = args.join(' ');
            
            // Filtros para mostrar apenas o interessante
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        // 3. DETETAR FIM DA INSTALAÇÃO (O TEU PEDIDO)
        // O componente dispara eventos quando o estado muda
        const buttons = document.querySelectorAll('esp-web-install-button');
        
        buttons.forEach(btn => {
            btn.addEventListener('state-change', (ev) => {
                // Estados: 'INSTALLING', 'SUCCESS', 'ERROR'
                if (ev.detail.state === 'INSTALLING') {
                    term.writeln('\n>>> INICIANDO PROCESSO DE FLASH...');
                }
                else if (ev.detail.state === 'SUCCESS') {
                    term.writeln('\n========================================');
                    term.writeln('   ✅ INSTALAÇÃO COMPLETA! SUCESSO.   ');
                    term.writeln('========================================');
                    term.writeln('> Podes desligar ou reiniciar o dispositivo.');
                }
                else if (ev.detail.state === 'ERROR') {
                    term.writeln('\n>>> ❌ ERRO NA INSTALAÇÃO.');
                    term.writeln(`> Detalhes: ${ev.detail.error || 'Desconhecido'}`);
                }
            });
        });

    </script>
</body>
</html>
