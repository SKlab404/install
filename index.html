<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Flash Utility</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0a0f0d;
    font-family:monospace;
    overflow:hidden;
    color:#9effd1;
}

/* SPLASH */
#splash{
    position:fixed;
    width:100%;
    height:100%;
    background:#0a0f0d;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:10;
    transition:0.5s ease;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}
#splash h1{
    font-size:3em;
    letter-spacing:6px;
    color:#9effd1;
}
#splash p{
    opacity:0.6;
}

/* TERMINAL */
#term{
    position:fixed;
    width:100%;
    height:100%;
}

/* BUTTON AREA */
#flashArea{
    position:fixed;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    z-index:1000;
}

.cleanBtn{
    background:transparent !important;
    color:#9effd1 !important;
    border:1px solid #9effd1 !important;
    padding:12px 30px !important;
    font-size:14px !important;
    letter-spacing:3px;
    cursor:pointer !important;
}
.cleanBtn:hover{
    background:#12201a !important;
}
</style>
</head>
<body>

<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Initialize secure flashing utility</p>
</div>

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cleanBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'transparent',
        foreground:'#9effd1',
        cursor:'#9effd1'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(text, delay=30){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

function enter(){

    document.getElementById("splash").classList.add("fade");

    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.4;
    intro.play().catch(()=>{});

    setTimeout(startSequence,500);
}

async function startSequence(){

    await type("Booting secure environment...");
    await sleep(400);

    await type("Loading drivers...");
    await sleep(400);

    await type("Waiting for device connection...");
    await sleep(400);

    term.write("\r\n");
    term.writeln("System ready.");
    term.writeln("");
    term.writeln("Authorization required.");

    document.getElementById("flashArea").style.display="block";
}

/* LOG CAPTURE */
const originalConsoleLog = console.log;

console.log = function (...args) {
    const msg = args.join(" ");

    // Chip detection
    if (msg.includes("ESP32-C5")) {
        term.writeln("");
        term.writeln("[DEVICE] ESP32-C5 detected");
        term.writeln("> Compatible firmware selected.");
    }

    // Progress
    if (
        msg.includes("Writing") ||
        msg.includes("%") ||
        msg.includes("Erasing")
    ) {
        term.writeln("> " + msg);
    }

    originalConsoleLog.apply(console, args);
};

/* INSTALL STATES */
document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("");
        term.writeln("> Flashing firmware...");
    }
    if(e.detail.state==="SUCCESS"){
        term.writeln("");
        term.writeln("✓ Flash complete");
    }
    if(e.detail.state==="ERROR"){
        term.writeln("");
        term.writeln("✗ " + e.detail.error);
    }
});

</script>

</body>
</html>
