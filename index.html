<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce & Marauder Command Center</title>
    <!-- Importar ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        :root { --bg: #0d1117; --term-bg: #000; --text: #c9d1d9; --accent: #58a6ff; --danger: #da3633; --success: #238636; }
        body { background: var(--bg); color: var(--text); font-family: 'Consolas', 'Monaco', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* HEADER */
        header { padding: 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; background: #161b22; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        /* LAYOUT PRINCIPAL */
        main { display: flex; flex: 1; overflow: hidden; }
        
        /* SIDEBAR (Botões de Flash) */
        .sidebar { width: 300px; padding: 20px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 15px; transition: 0.2s; }
        .card:hover { border-color: var(--accent); }
        .card h3 { margin: 0 0 10px 0; font-size: 1rem; color: #fff; }
        .card p { font-size: 0.8rem; color: #8b949e; margin-bottom: 15px; }
        
        /* Botões Customizados */
        esp-web-install-button button {
            background: #238636; color: white; border: none; padding: 8px 16px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit;
        }
        esp-web-install-button button:hover { background: #2ea043; }
        
        .danger-zone { border-color: var(--danger) !important; }
        .danger-zone h3 { color: var(--danger); }
        .danger-btn { background: var(--danger) !important; }
        .danger-btn:hover { background: #b62324 !important; }

        /* TERMINAL AREA */
        .terminal-container { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 10px; }
        .term-controls { display: flex; gap: 10px; }
        
        #serialConsole {
            flex: 1; background: var(--term-bg); border: 1px solid #30363d; border-radius: 6px; padding: 15px; 
            overflow-y: auto; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; color: #0f0;
        }
        
        .input-line { display: flex; gap: 10px; }
        input#cmdInput { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 6px; font-family: inherit; }
        button.action-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.disconnect-btn { background: #888; }
        
    </style>
</head>
<body>

    <header>
        <h1>⚡ ESP32 Command Center</h1>
        <div id="status">Status: Desligado</div>
    </header>

    <main>
        <!-- BARRA LATERAL: FLASHING -->
        <div class="sidebar">
            <div style="text-align: center; color: #8b949e; font-size: 0.8em; margin-bottom: 10px;">FIRMWARE INSTALLER</div>

            <!-- MARAUDER C5 -->
            <div class="card">
                <h3>📱 Marauder C5</h3>
                <p>M5StickC / Plus (ESP32)</p>
                <esp-web-install-button manifest="manifest_c5.json">
                    <button slot="activate">INSTALL C5</button>
                </esp-web-install-button>
            </div>

            <!-- MARAUDER STD -->
            <div class="card">
                <h3>📟 Marauder STD</h3>
                <p>DevKit V1 / WROOM (ESP32)</p>
                <esp-web-install-button manifest="manifest_std.json">
                    <button slot="activate">INSTALL STD</button>
                </esp-web-install-button>
            </div>

            <!-- BRUCE S3 (PERIGO) -->
            <div class="card danger-zone">
                <h3>🔥 BRUCE S3</h3>
                <p>Smoochie / S3 Zero (ESP32-S3)</p>
                <esp-web-install-button manifest="manifest_bruce.json">
                    <button slot="activate" class="danger-btn">INSTALL REAPER</button>
                </esp-web-install-button>
            </div>
        </div>

        <!-- ÁREA CENTRAL: TERMINAL -->
        <div class="terminal-container">
            <div class="term-controls">
                <button id="connectBtn" class="action-btn">🔌 Ligar Terminal</button>
                <button id="clearBtn" class="action-btn" style="background: #333; color: #fff;">Limpar</button>
            </div>

            <div id="serialConsole">
                <div style="color: #666;">> Aguardando conexão Serial... (Clica em "Ligar Terminal")</div>
            </div>

            <div class="input-line">
                <input type="text" id="cmdInput" placeholder="Escreve um comando e carrega Enter..." disabled>
                <button id="sendBtn" class="action-btn" disabled>Enviar</button>
            </div>
        </div>
    </main>

    <script>
        // --- LÓGICA DO TERMINAL SERIAL ---
        let port;
        let reader;
        let writer;
        let keepReading = false;

        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const cmdInput = document.getElementById('cmdInput');
        const consoleDiv = document.getElementById('serialConsole');
        const statusDiv = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');

        // LIGAR
        connectBtn.addEventListener('click', async () => {
            if (port) { // Se já tiver porta, desliga (Toggle)
                keepReading = false;
                reader.cancel();
                await port.close();
                port = null;
                connectBtn.textContent = '🔌 Ligar Terminal';
                connectBtn.classList.remove('disconnect-btn');
                cmdInput.disabled = true;
                sendBtn.disabled = true;
                statusDiv.textContent = 'Status: Desligado';
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Baudrate padrão ESP32

                statusDiv.textContent = 'Status: CONECTADO 🟢';
                connectBtn.textContent = '❌ Desligar';
                connectBtn.classList.add('disconnect-btn');
                cmdInput.disabled = false;
                sendBtn.disabled = false;
                cmdInput.focus();

                // Configurar Writer
                const textEncoder = new TextEncoderStream();
                const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                // Ler Loop
                keepReading = true;
                readLoop();

            } catch (err) {
                console.error(err);
                alert("Erro ao conectar: " + err.message);
            }
        });

        // LOOP DE LEITURA
        async function readLoop() {
            while (port.readable && keepReading) {
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) appendToConsole(value);
                    }
                } catch (error) {
                    console.error(error);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        // MOSTRAR NO TERMINAL
        function appendToConsole(text) {
            const span = document.createElement('span');
            span.textContent = text;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight; // Auto-scroll
        }

        // ENVIAR COMANDO
        async function sendCommand() {
            const cmd = cmdInput.value;
            if (!writer || cmd === "") return;
            
            await writer.write(cmd + '\n'); // Envia com quebra de linha
            appendToConsole('> ' + cmd + '\n'); // Echo local
            cmdInput.value = '';
        }

        sendBtn.addEventListener('click', sendCommand);
        cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        clearBtn.addEventListener('click', () => {
            consoleDiv.innerHTML = '<div style="color: #666;">> Terminal limpo.</div>';
        });

        // --- PROTEÇÃO DO BRUCE ---
        const bruceBtn = document.querySelector('.danger-btn');
        if(bruceBtn) {
            bruceBtn.parentNode.addEventListener('click', (e) => {
                // Apanha o clique no wrapper do botão
                if(!confirm("⚠️ CONFIRMAÇÃO DE SEGURANÇA ⚠️\n\nEste firmware é para ESP32-S3 (Smoochie/Zero).\n\nTens a certeza que a board correta está ligada?")) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true); // Use capture phase
        }
    </script>
</body>
</html>
