<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V39 (DEBUGGER)</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #aaa; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #controls { padding: 15px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        #term { flex: 1; background: #000; padding: 10px; }
    </style>
</head>
<body>

    <div id="controls">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>
    </div>

    <div id="term"></div>

    <script>
        const term = new Terminal({ theme: { background: '#000' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== V39 DEBUG MODE ===');

        // Captura TUDO (Log, Info, Warn, Error)
        ['log', 'info', 'warn', 'error'].forEach(method => {
            const original = console[method];
            console[method] = function(...args) {
                original.apply(console, args);
                term.writeln(`[${method.toUpperCase()}] ${args.join(' ')}`);
            };
        });

        // Ouvir estado do botão
        const btn = document.querySelector('esp-web-install-button');
        btn.addEventListener('state-change', (e) => {
            term.writeln(`\n>>> ESTADO MUDOU: ${e.detail.state}`);
            if (e.detail.error) {
                term.writeln(`>>> ERRO DETALHADO: ${e.detail.error}`);
            }
        });
    </script>
</body>
</html>
