<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V31 (UNLOCKER)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #1a0505; color: #ff4444; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        #header { padding: 20px; background: #2a0a0a; border-bottom: 2px solid #800; text-align: center; }
        
        button { 
            padding: 15px 25px; margin: 0 10px; 
            background: #400; color: #fbb; border: 1px solid #f00; 
            cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase;
        }
        button:hover { background: #800; box-shadow: 0 0 15px #f00; }
        button:disabled { background: #211; color: #533; border-color: #422; box-shadow: none; }
        
        #btn-forget { background: #fa0; color: #000; border-color: #fa0; }
        
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <button id="btn-c5" onclick="flash('manifest_c5.json')" disabled>A CARREGAR...</button>
        <button id="btn-std" onclick="flash('manifest_std.json')" disabled>A CARREGAR...</button>
        <button id="btn-bruce" onclick="flash('manifest_bruce.json')" disabled style="color:#fff; border-color:#fff">BRUCE</button>
        
        <!-- BOTÃO DE PÂNICO -->
        <button id="btn-forget" onclick="revokePermissions()">🧹 ESQUECER PORTAS</button>
    </div>

    <div id="term"></div>

    <script type="module">
        import * as esptool from 'https://esm.run/esptool-js@0.5.6';
        window.ESPLoader = esptool.ESPLoader;
        window.Transport = esptool.Transport;
        window.libReady = true;
        if (window.term) {
            window.term.writeln('\x1b[1;31m> V31 (RED ALERT) - PRONTO.\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        const term = new Terminal({ theme: { background: '#1a0505', foreground: '#ff4444', cursor: '#f00' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V31 ===');
        term.writeln('> A verificar portas presas...');

        // TENTATIVA AUTOMÁTICA DE DESBLOQUEIO AO INICIAR
        async function unlockPorts() {
            if (!navigator.serial) return;
            const ports = await navigator.serial.getPorts();
            if (ports.length > 0) {
                term.writeln(`> Detetadas ${ports.length} portas na memória.`);
                for (const port of ports) {
                    try { await port.close(); term.writeln('> Porta antiga fechada.'); } catch(e) {}
                }
            } else {
                term.writeln('> Nenhuma porta presa detetada.');
            }
        }
        unlockPorts();

        // FUNÇÃO PARA "ESQUECER" PERMISSÕES (Reseta a conexão do browser)
        async function revokePermissions() {
            const ports = await navigator.serial.getPorts();
            for (const port of ports) {
                await port.forget();
            }
            alert("Portas esquecidas. A página vai recarregar.");
            location.reload();
        }

        const check = setInterval(() => {
            if (window.libReady) { clearInterval(check); enableButtons(); }
        }, 500);

        function enableButtons() {
            if(document.getElementById('btn-c5').innerText !== "A CARREGAR...") return;
            document.querySelectorAll('button:not(#btn-forget)').forEach(b => {
                b.disabled = false;
                b.innerText = b.innerText.replace("A CARREGAR...", "FLASH");
            });
        }

        async function flash(manifestUrl) {
            const btns = document.querySelectorAll('button:not(#btn-forget)');
            btns.forEach(b => b.disabled = true);

            try {
                term.writeln(`\n> [1] Manifesto...`);
                let manifest;
                try {
                    manifest = await fetch(manifestUrl).then(r => { if(!r.ok) throw new Error(); return r.json(); });
                } catch (e) {
                    manifest = await fetch('/install/' + manifestUrl).then(r => r.json());
                }

                term.writeln('> [2] Porta Serial...');
                let port;
                try {
                    // Tenta pedir porta nova
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                } catch (e) {
                    if (e.message.includes("already open")) {
                        term.writeln('\n\x1b[1;33m>>> PORTA BLOQUEADA! Tenta isto: <<<\x1b[0m');
                        term.writeln('1. Clica no botão laranja "ESQUECER PORTAS".');
                        term.writeln('2. Se não der, FECHA ESTA ABA e abre de novo.');
                        term.writeln('3. Último recurso: Reinicia o PC.');
                        throw new Error("Porta presa (Zombie Port).");
                    } else {
                        throw e;
                    }
                }

                term.writeln('> [3] Conectando...');
                const transport = new window.Transport(port);
                const loader = new window.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (d) => term.writeln(d),
                        write: (d) => term.write(d)
                    }
                });

                let chipName = "DESCONHECIDO";
                try {
                    // Tenta main() primeiro (v0.5.6)
                    if (typeof loader.main === "function") chipName = await loader.main();
                    else if (typeof loader.main_fn === "function") chipName = await loader.main_fn();
                    else { await loader.connect(); chipName = "Stub"; }
                } catch (e) {
                    // Hack para C5
                    if (e.message.includes("Unknown Chip") || e.message.includes("0x5fd1406f")) {
                        term.writeln('\x1b[1;33m> Chip C5 detetado! Forçando...\x1b[0m');
                        chipName = "ESP32-C5 (Forced)";
                    } else { throw e; }
                }
                
                term.writeln(`> Chip: ${chipName}`);
                
                term.writeln('> [4] A APAGAR FLASH...');
                await loader.erase_flash();

                term.writeln('> [5] A ESCREVER...');
                for (let part of manifest.builds[0].parts) {
                    term.writeln(`  -> ${part.path}...`);
                    let bin;
                    try {
                        bin = await fetch(part.path).then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); });
                    } catch(e) {
                        bin = await fetch('/install/' + part.path).then(r => r.arrayBuffer());
                    }

                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {} 
                    });
                }

                term.writeln('\n> [SUCESSO] Reinicia o dispositivo!');
                await loader.hard_reset();
                await port.close();

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
