<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 // Wizard Pro</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0a0f0d;
    font-family:monospace;
    color:#00ff9d;
    overflow:hidden;
}

/* SPLASH */
#splash{
    position:fixed;
    inset:0;
    background:#0a0f0d;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:20;
    transition:0.5s;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}

/* LAYOUT */
#container{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
#steps{
    width:220px;
    background:#060a08;
    padding:30px 20px;
    border-right:1px solid #00ff9d22;
}

.step{
    margin-bottom:25px;
    opacity:0.4;
}
.step.active{
    opacity:1;
}

/* MAIN */
#main{
    flex:1;
    padding:40px;
}

/* DEVICE CARDS */
.deviceCard{
    border:1px solid #00ff9d55;
    padding:20px;
    cursor:pointer;
    display:inline-block;
    margin-right:15px;
    transition:0.3s;
}
.deviceCard:hover{
    background:#002e20;
}
.deviceCard.selected{
    background:#003b2a;
}

/* TERMINAL */
#term{
    width:100%;
    height:45vh;
    background:#000000ee;
    border:1px solid #00ff9d55;
    margin-top:20px;
}

/* BUTTON */
.actionBtn{
    margin-top:20px;
    padding:10px 20px;
    border:1px solid #00ff9d;
    background:transparent;
    color:#00ff9d;
    cursor:pointer;
}

/* PROGRESS BAR */
#progressContainer{
    width:100%;
    height:20px;
    background:#001a12;
    margin-top:20px;
    display:none;
}
#progressBar{
    height:100%;
    width:0%;
    background:#00ff9d;
    transition:width 0.2s;
}

/* SUCCESS */
#success{
    display:none;
    margin-top:30px;
}
</style>
</head>
<body>

<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to start flashing wizard</p>
</div>

<div id="container">

<div id="steps">
    <div class="step active" id="step1">1. Select Device</div>
    <div class="step" id="step2">2. Flash</div>
    <div class="step" id="step3">3. Done</div>
</div>

<div id="main">

    <!-- STEP 1 -->
    <div id="deviceSelection">
        <div class="deviceCard" onclick="selectDevice('manifest_c5.json', this)">ESP32-C5</div>
        <div class="deviceCard" onclick="selectDevice('manifest_c3.json', this)">ESP32-C3</div>
        <div class="deviceCard" onclick="selectDevice('manifest_s3.json', this)">ESP32-S3</div>
    </div>

    <!-- STEP 2 -->
    <div id="flashSection" style="display:none;">

        <label>Baud Rate:</label>
        <select id="baudSelect">
            <option value="115200">115200</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
        </select>

        <esp-web-install-button id="flashBtn">
            <button slot="activate" class="actionBtn">CONNECT & FLASH</button>
        </esp-web-install-button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="term"></div>

    </div>

    <!-- STEP 3 -->
    <div id="success">
        <h2>FLASH COMPLETE</h2>
        <button class="actionBtn" onclick="location.reload()">FLASH ANOTHER</button>
    </div>

</div>
</div>

<script>

/* TERMINAL */
const term = new Terminal({
    theme:{background:'transparent',foreground:'#00ff9d',cursor:'#00ff9d'},
    fontSize:15,
    cursorBlink:true
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();

/* INTRO */
function enter(){
    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.5;
    intro.play().catch(()=>{});
    document.getElementById("splash").classList.add("fade");
}

/* DEVICE SELECT */
function selectDevice(manifest, el){
    document.querySelectorAll(".deviceCard").forEach(e=>e.classList.remove("selected"));
    el.classList.add("selected");

    const btn = document.getElementById("flashBtn");
    btn.setAttribute("manifest", manifest);

    document.getElementById("deviceSelection").style.display="none";
    document.getElementById("flashSection").style.display="block";

    document.getElementById("step1").classList.remove("active");
    document.getElementById("step2").classList.add("active");
}

/* PROGRESS + LOG */
const originalConsoleLog = console.log;

console.log = function (...args){

    const msg = args.join(" ");

    if(msg.includes("ESP32")){
        term.writeln("[DEVICE] " + msg);
    }

    if(msg.includes("Writing") || msg.includes("%")){
        term.writeln("> " + msg);

        const match = msg.match(/(\d+)%/);
        if(match){
            document.getElementById("progressContainer").style.display="block";
            document.getElementById("progressBar").style.width = match[1] + "%";
        }
    }

    if(msg.includes("Hash of data verified") || msg.includes("Leaving...")){
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step3").classList.add("active");
        document.getElementById("success").style.display="block";
    }

    originalConsoleLog.apply(console,args);
};

</script>
</body>
</html>
