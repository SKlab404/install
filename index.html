<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ MARAUDER FLASH V3.0</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: #000;
            color: #00ff41;
            font-family: 'Orbitron', monospace;
            overflow-y: auto; /* Permite scroll se necessário */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }
        
        /* --- TERMINAL COMPACTO (HEADER) --- */
        .terminal-bar {
            width: 100%; max-width: 800px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff41;
            border-radius: 5px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 0 10px #00ff41;
        }
        .status-text { font-family: 'VT323', monospace; font-size: 20px; color: #00ff41; }
        .blink { animation: blink 1s infinite; }

        /* --- TÍTULO --- */
        .glitch-text {
            font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 20px;
            text-shadow: 2px 2px #d600ff;
        }

        /* --- ÁREA DE VÍDEO --- */
        .video-frame {
            width: 100%; max-width: 600px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        /* Moldura Cyberpunk no vídeo */
        .video-frame::before {
            content: "INSTALL_GUIDE.mp4";
            position: absolute; top: 5px; left: 10px;
            font-family: 'VT323'; color: rgba(0,255,65,0.7);
            background: rgba(0,0,0,0.8); padding: 2px 5px;
            z-index: 5; pointer-events: none;
        }

        /* --- BOTÕES --- */
        .control-panel {
            display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 40px;
        }
        esp-web-install-button { display: block !important; }
        .custom-btn {
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #00ff41;
            width: 280px; height: 100px;
            cursor: pointer;
            position: relative;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            transition: all 0.2s;
        }
        .custom-btn:hover { transform: translateY(-5px); box-shadow: 0 0 25px #00ff41; background: rgba(0, 255, 65, 0.1); }
        .btn-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .btn-desc { font-family: 'VT323'; font-size: 18px; color: #00ff41; }
        .pro-mode { border-color: #d600ff; }
        .pro-mode:hover { box-shadow: 0 0 25px #d600ff; background: rgba(214, 0, 255, 0.1); }
        .pro-mode .btn-desc { color: #d600ff; }

        /* --- SOCIAL LINKS (RODAPÉ) --- */
        .social-dock {
            display: flex; gap: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
        }
        .social-icon {
            color: #666; font-size: 24px; transition: all 0.3s;
        }
        .social-icon:hover { color: #fff; transform: scale(1.2); text-shadow: 0 0 10px #fff; }
        .github:hover { color: #fff; }
        .youtube:hover { color: #f00; text-shadow: 0 0 10px #f00; }
        .discord:hover { color: #5865F2; text-shadow: 0 0 10px #5865F2; }

        @keyframes blink { 50% { opacity: 0; } }
        @media (max-width: 700px) { .glitch-text { font-size: 28px; } .control-panel { gap: 15px; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <!-- 1. TERMINAL COMPACTO (STATUS BAR) -->
    <div class="terminal-bar">
        <span class="status-text">> SYSTEM: READY</span>
        <span class="status-text blink">_</span>
    </div>

    <!-- 2. TÍTULO -->
    <div class="glitch-text">MARAUDER FLASH TOOL</div>

    <!-- 3. VÍDEO TUTORIAL -->
    <div class="video-frame">
        <!-- Substitua o ID pelo seu vídeo -->
        <iframe width="100%" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Tutorial" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- 4. BOTÕES DE INSTALAÇÃO -->
    <div class="control-panel">
        <esp-web-install-button manifest="manifest_normal.json">
            <button slot="activate" class="custom-btn" onclick="updateStatus('Initializing Standard Protocol...')" onmouseenter="playHoverSound()">
                <span class="btn-title">STANDARD</span>
                <span class="btn-desc">ESP32 (WROOM/WROVER)</span>
            </button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_5g.json">
            <button slot="activate" class="custom-btn pro-mode" onclick="updateStatus('Initializing 5G Protocol...')" onmouseenter="playHoverSound()">
                <span class="btn-title">5G / C5</span>
                <span class="btn-desc">ESP32-C5 (RISC-V)</span>
            </button>
        </esp-web-install-button>
    </div>

    <!-- 5. SOCIAL DOCK -->
    <div class="social-dock">
        <a href="https://github.com/DtechScript" target="_blank" class="social-icon github"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" class="social-icon youtube"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank" class="social-icon discord"><i class="fab fa-discord"></i></a>
    </div>

    <script>
        // MATRIX
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '01XYZABC'; const fontSize = 14; const columns = canvas.width/fontSize; const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#0F0'; ctx.font = fontSize+'px monospace';
            for(let i=0; i<drops.length; i++) {
                const text = chars[Math.floor(Math.random()*chars.length)]; ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i]=0; drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // ATUALIZA BARRA DE STATUS
        function updateStatus(msg) {
            document.querySelector('.status-text').innerText = '> SYSTEM: ' + msg;
            playClickSound();
        }

        // SONS (AudioContext)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHoverSound() {
            if(audioCtx.state==='suspended') audioCtx.resume();
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(800, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime+0.05);
            g.gain.setValueAtTime(0.02, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.05);
            o.start(); o.stop(audioCtx.currentTime+0.05);
        }
        function playClickSound() {
            if(audioCtx.state==='suspended') audioCtx.resume();
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
            o.type='square'; o.frequency.setValueAtTime(200, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime+0.2);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2);
            o.start(); o.stop(audioCtx.currentTime+0.2);
        }
    </script>
</body>
</html>
