<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CYBER DECK // FLASH & TERMINAL</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ff41; border-radius: 4px; }

        body {
            background: #000; color: #00ff41; font-family: 'Orbitron', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        canvas#matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        /* HEADER */
        header {
            padding: 15px 30px; border-bottom: 2px solid #00ff41; background: rgba(0,20,0,0.9);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px #00ff41; }
        .status-badge { font-family: 'VT323'; font-size: 20px; color: #00ff41; }

        /* MAIN LAYOUT */
        main { display: flex; flex: 1; padding: 20px; gap: 20px; z-index: 5; height: calc(100vh - 70px); }
        
        /* LEFT PANEL: FLASHING */
        .panel-flash {
            flex: 0 0 350px; background: rgba(0,10,0,0.8); border: 1px solid #333;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto; backdrop-filter: blur(5px);
        }
        
        /* RIGHT PANEL: TERMINAL */
        .panel-terminal {
            flex: 1; display: flex; flex-direction: column; 
            background: rgba(0,0,0,0.9); border: 2px solid #333; position: relative;
        }

        /* BUTTON STYLES */
        .section-title { color: #fff; font-size: 14px; margin-bottom: 10px; opacity: 0.7; }
        
        esp-web-install-button { width: 100%; display: block; }
        
        .cyber-btn {
            width: 100%; padding: 15px; margin-bottom: 10px;
            background: rgba(0, 40, 0, 0.6); border: 1px solid #00ff41; color: #fff;
            cursor: pointer; text-align: left; transition: 0.2s; position: relative;
        }
        .cyber-btn:hover { background: rgba(0, 255, 65, 0.2); transform: translateX(5px); box-shadow: -5px 0 0 #00ff41; }
        
        .btn-main { font-size: 18px; font-weight: bold; display: block; }
        .btn-sub { font-family: 'VT323'; font-size: 14px; color: #00ff41; display: block; opacity: 0.8; }

        .danger-zone { border-color: #ff0055; }
        .danger-zone .btn-sub { color: #ff0055; }
        .danger-zone:hover { background: rgba(255, 0, 85, 0.15); box-shadow: -5px 0 0 #ff0055; }

        /* TERMINAL STYLES */
        .term-header {
            padding: 10px; background: #111; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .term-output {
            flex: 1; padding: 15px; font-family: 'VT323', monospace; font-size: 16px; 
            overflow-y: auto; color: #ccc; white-space: pre-wrap;
        }
        .term-input-area {
            padding: 10px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px;
        }
        input#cmdInput {
            flex: 1; background: #000; border: 1px solid #333; color: #00ff41; 
            padding: 8px; font-family: 'VT323'; font-size: 18px;
        }
        button.term-btn {
            background: #00ff41; color: #000; border: none; padding: 0 20px; 
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
        }
        button.term-btn:disabled { background: #333; cursor: not-allowed; }

        .log-sys { color: #00ff41; }
        .log-tx { color: #00ffff; }
        .log-rx { color: #cccccc; }

        /* INTRO OVERLAY */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- INTRO -->
    <div id="intro-overlay" onclick="startSystem()">
        <h1 style="text-shadow: 0 0 20px #00ff41;">SYSTEM OFFLINE</h1>
        <p style="font-family: 'VT323'; font-size: 20px; margin-top: 10px;">[ CLICK TO INITIALIZE ]</p>
    </div>

    <canvas id="matrix"></canvas>

    <header>
        <div class="logo"><i class="fas fa-microchip"></i> CYBER DECK</div>
        <div class="status-badge" id="statusMsg">SYSTEM: READY</div>
    </header>

    <main>
        <!-- LEFT: FLASHING -->
        <div class="panel-flash">
            <div class="section-title">// FIRMWARE ARMORY</div>

            <!-- MARAUDER STD -->
            <esp-web-install-button manifest="manifest_std.json">
                <button slot="activate" class="cyber-btn">
                    <span class="btn-main">MARAUDER STD</span>
                    <span class="btn-sub">ESP32 WROOM / DEV KIT</span>
                </button>
            </esp-web-install-button>

            <!-- MARAUDER C5 -->
            <esp-web-install-button manifest="manifest_c5.json">
                <button slot="activate" class="cyber-btn">
                    <span class="btn-main">MARAUDER C5</span>
                    <span class="btn-sub">M5STICK / CARDPUTER</span>
                </button>
            </esp-web-install-button>

            <!-- BRUCE S3 -->
            <div class="section-title" style="margin-top: 20px; color: #ff0055;">// RESTRICTED ACCESS</div>
            <esp-web-install-button manifest="manifest_bruce.json">
                <button slot="activate" class="cyber-btn danger-zone" onclick="warningProtocol()">
                    <span class="btn-main">BRUCE // REAPER</span>
                    <span class="btn-sub">S3 ZERO / SMOOCHIE ONLY</span>
                </button>
            </esp-web-install-button>
        </div>

        <!-- RIGHT: TERMINAL -->
        <div class="panel-terminal">
            <div class="term-header">
                <span><i class="fas fa-terminal"></i> SERIAL UPLINK</span>
                <button id="connectBtn" class="term-btn" style="height: 30px; font-size: 12px;">CONNECT</button>
            </div>
            <div id="terminal" class="term-output">
                <span class="log-sys">> WAITING FOR TARGET...</span><br>
                <span class="log-sys">> CLICK "CONNECT" TO START SERIAL LINK.</span>
            </div>
            <div class="term-input-area">
                <span style="color: #00ff41; padding-top: 5px;">$</span>
                <input type="text" id="cmdInput" placeholder="Enter command..." disabled>
                <button id="sendBtn" class="term-btn" disabled>SEND</button>
                <button id="clearBtn" class="term-btn" style="background: #333; color: #fff;">CLR</button>
            </div>
        </div>
    </main>

    <script>
        // --- MATRIX FX ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '01XYZABC'; const fontSize = 14; 
        const drops = Array(Math.floor(canvas.width/fontSize)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#0F0';
            drops.forEach((y, i) => {
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, y*fontSize);
                if(y*fontSize > canvas.height && Math.random()>0.975) drops[i]=0; drops[i]++;
            });
        }
        setInterval(draw, 50);

        // --- AUDIO & INTRO ---
        function startSystem() {
            document.getElementById('intro-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('intro-overlay').remove(), 1000);
            const audio = new Audio('intro.mp3'); audio.volume = 0.4; audio.play().catch(()=>{});
        }

        // --- FUNNY POPUP FOR BRUCE ---
        function warningProtocol() {
            if(!confirm("💀 REAPER PROTOCOL INITIATED 💀\n\nAre you trying to summon demons or just flash an S3?\n\nConfirm you have the RIGHT HARDWARE (S3 Zero/Smoochie).\n(I am not responsible if your house turns into a portal.)")) {
                event.stopPropagation(); event.preventDefault();
            }
        }

        // --- TERMINAL LOGIC (THE BRAINS) ---
        let port, reader, writer, readableStreamClosed, writableStreamClosed;
        const term = document.getElementById('terminal');
        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('cmdInput');

        function log(msg, type='log-sys') {
            const line = document.createElement('div');
            line.className = type; line.textContent = msg;
            term.appendChild(line); term.scrollTop = term.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            if (port) { // DISCONNECT
                reader.cancel(); await readableStreamClosed.catch(()=>{});
                writer.close(); await writableStreamClosed;
                await port.close(); port = null;
                connectBtn.textContent = 'CONNECT'; connectBtn.style.background = '#00ff41';
                input.disabled = true; sendBtn.disabled = true;
                log('> LINK TERMINATED.', 'log-sys');
                return;
            }
            try { // CONNECT
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const textDecoder = new TextDecoderStream();
                readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                
                const textEncoder = new TextEncoderStream();
                writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                connectBtn.textContent = 'DISCONNECT'; connectBtn.style.background = '#ff0055';
                input.disabled = false; sendBtn.disabled = false; input.focus();
                log('> UPLINK ESTABLISHED. 115200 BAUD.', 'log-sys');
                readLoop();
            } catch (e) { log('> ERROR: ' + e, 'log-sys'); }
        });

        async function readLoop() {
            while (port.readable) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    // Simply append text. Complex ANSI parsing omitted for speed.
                    term.insertAdjacentText('beforeend', value);
                    term.scrollTop = term.scrollHeight;
                } catch (e) { break; }
            }
        }

        async function send() {
            const data = input.value;
            if (port && writer && data) {
                await writer.write(data + '\n');
                log('> ' + data, 'log-tx');
                input.value = '';
            }
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
        document.getElementById('clearBtn').addEventListener('click', () => term.innerHTML = '');

    </script>
</body>
</html>
