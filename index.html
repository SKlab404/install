<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER FLASHER PRO</title>
    <!-- ESPTOOL-JS -->
    <script src="https://unpkg.com/@esphome/esptool-js@0.5.6/dist/esptool-js.umd.js"></script>
    <!-- XTERM.JS (Terminal Profissional) -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; color: #00ff41; font-family: 'Orbitron', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        header { padding: 15px 30px; background: #001100; border-bottom: 2px solid #00ff41; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px #00ff41; }
        
        /* LAYOUT */
        main { display: flex; flex: 1; padding: 0; overflow: hidden; }
        
        /* SIDEBAR (Flash Buttons) */
        .sidebar { width: 320px; background: rgba(0,20,0,0.95); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        /* TERMINAL AREA */
        .terminal-container { flex: 1; background: #000; position: relative; padding: 10px; display: flex; flex-direction: column; }
        #terminal { flex: 1; width: 100%; height: 100%; }
        
        /* BUTTONS */
        .cyber-btn {
            background: rgba(0, 50, 0, 0.4); border: 1px solid #00ff41; color: #fff; padding: 15px;
            cursor: pointer; text-align: left; transition: 0.2s; font-family: 'Orbitron'; margin-bottom: 5px;
        }
        .cyber-btn:hover { background: rgba(0, 255, 65, 0.2); border-left: 5px solid #00ff41; padding-left: 10px; }
        .btn-title { display: block; font-size: 16px; font-weight: bold; color: #00ff41; margin-bottom: 3px; }
        .btn-desc { display: block; font-size: 12px; color: #aaa; font-family: 'VT323'; }
        
        .danger { border-color: #ff0055; }
        .danger .btn-title { color: #ff0055; }
        .danger:hover { background: rgba(255, 0, 85, 0.15); border-left-color: #ff0055; }

        /* CONTROLS */
        .controls { padding: 10px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; background: #000; border: 1px solid #333; color: #00ff41; padding: 10px; font-family: 'VT323'; font-size: 16px; outline: none; }
        .action-btn { background: #333; color: #fff; border: 1px solid #555; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background: #444; }
        .connect-btn { background: #00ff41; color: #000; border: none; }
        .disconnect { background: #ff0055 !important; color: #fff !important; }

        /* LOADING OVERLAY */
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00ff41; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text" style="color: #fff; font-size: 20px;">FLASHING FIRMWARE...</div>
        <div id="progress-text" style="color: #00ff41; margin-top: 10px;">0%</div>
    </div>

    <header>
        <div class="logo"><i class="fas fa-microchip"></i> CYBER DECK</div>
        <div style="font-size: 12px; color: #666;">READY TO FLASH</div>
    </header>

    <main>
        <div class="sidebar">
            <h3 style="color: #fff; opacity: 0.5; font-size: 12px;">SELECT TARGET</h3>
            
            <button class="cyber-btn" onclick="flash('manifest_std.json')">
                <span class="btn-title">MARAUDER STD</span>
                <span class="btn-desc">ESP32 WROOM / DEV KIT</span>
            </button>
            
            <button class="cyber-btn" onclick="flash('manifest_c5.json')">
                <span class="btn-title">MARAUDER C5</span>
                <span class="btn-desc">M5STICK / CARDPUTER</span>
            </button>
            
            <button class="cyber-btn danger" onclick="flash('manifest_bruce.json')">
                <span class="btn-title">🔥 BRUCE REAPER</span>
                <span class="btn-desc">S3 ZERO / SMOOCHIE ONLY</span>
            </button>
        </div>

        <div class="terminal-container">
            <div id="terminal"></div>
            <div class="controls">
                <button id="connectBtn" class="action-btn connect-btn">CONNECT SERIAL</button>
                <input id="cmdInput" placeholder="Enter command..." disabled>
                <button id="clearBtn" class="action-btn">CLR</button>
            </div>
        </div>
    </main>

    <script>
        // --- XTERM SETUP ---
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#000000', foreground: '#00ff41', cursor: '#00ff41' },
            fontFamily: 'Courier New, monospace',
            fontSize: 14,
            convertEol: true // Resolve o problema das quebras de linha!
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();
        
        term.writeln('\x1b[1;32m> SYSTEM ONLINE. WAITING FOR CONNECTION...\x1b[0m');

        // --- FLASH LOGIC ---
        async function flash(manifestUrl) {
            const overlay = document.getElementById('loading');
            const progText = document.getElementById('progress-text');
            
            try {
                // 1. Load JSON
                const resp = await fetch(manifestUrl);
                if (!resp.ok) throw new Error("Manifest not found: " + manifestUrl);
                const manifest = await resp.json();
                
                // 2. Select Port
                term.writeln(`\n> Requesting port for ${manifest.name}...`);
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                // 3. Setup Esptool
                const esptool = new EspTool({
                    transport: new Transport(port),
                    loaderOptions: { flashBaud: 460800 },
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (l) => term.writeln(l),
                        write: (s) => term.write(s)
                    }
                });

                // 4. Start Flash
                overlay.style.display = 'flex';
                term.writeln('> Initializing...');
                
                await esptool.connect();
                term.writeln('> Connected! Erasing flash...');
                progText.innerText = "ERASING...";
                
                // Hack to update UI during heavy JS work
                await new Promise(r => setTimeout(r, 100));
                
                const fileItem = manifest.builds[0].parts[0];
                const fileData = await fetch(fileItem.path).then(r => r.arrayBuffer());
                
                term.writeln(`> Flashing ${fileItem.path} (${fileData.byteLength} bytes)...`);
                progText.innerText = "WRITING...";
                
                await esptool.flashData(new Uint8Array(fileData), fileItem.offset, 0);
                
                term.writeln('\n> RESETTING DEVICE...');
                await esptool.hardReset();
                await port.close(); // Close port so we can reconnect with Serial Monitor

                overlay.style.display = 'none';
                term.writeln('\x1b[1;32m> FLASH COMPLETE! CLICK "CONNECT SERIAL" TO VIEW LOGS.\x1b[0m');

            } catch (e) {
                overlay.style.display = 'none';
                term.writeln(`\n\x1b[1;31m> ERROR: ${e.message}\x1b[0m`);
            }
        }

        // --- SERIAL MONITOR LOGIC ---
        let port, reader, writer, readableStreamClosed, writableStreamClosed;
        const connectBtn = document.getElementById('connectBtn');
        const cmdInput = document.getElementById('cmdInput');

        connectBtn.onclick = async () => {
            if (port) { // Disconnect
                reader.cancel(); await readableStreamClosed.catch(()=>{});
                writer.close(); await writableStreamClosed;
                await port.close(); port = null;
                connectBtn.innerText = 'CONNECT SERIAL';
                connectBtn.classList.remove('disconnect');
                cmdInput.disabled = true;
                term.writeln('\n> DISCONNECTED.');
                return;
            }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                term.writeln('\n\x1b[1;32m> CONNECTED TO SERIAL (115200 BAUD)\x1b[0m');
                connectBtn.innerText = 'DISCONNECT';
                connectBtn.classList.add('disconnect');
                cmdInput.disabled = false;
                cmdInput.focus();

                // Setup Read
                const decoder = new TextDecoderStream();
                readableStreamClosed = port.readable.pipeTo(decoder.writable);
                reader = decoder.readable.getReader();
                
                // Setup Write
                const encoder = new TextEncoderStream();
                writableStreamClosed = encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();

                readLoop();

            } catch (e) { term.writeln(`\n\x1b[1;31m> SERIAL ERROR: ${e.message}\x1b[0m`); }
        };

        async function readLoop() {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                term.write(value); // xterm handles ANSI codes & newlines automatically!
            }
        }

        // Send Command
        cmdInput.onkeydown = async (e) => {
            if (e.key === 'Enter' && port && writer) {
                const data = cmdInput.value;
                await writer.write(data + '\r\n');
                cmdInput.value = '';
                // term.writeln(`> ${data}`); // Echo (optional)
            }
        };
        
        document.getElementById('clearBtn').onclick = () => term.clear();

    </script>
</body>
</html>
