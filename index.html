<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V32 (SMART OPEN)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #0d0d0d; color: #00ff00; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #333; text-align: center; }
        button { padding: 15px 25px; margin: 0 10px; background: #004400; color: #fff; border: 1px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #006600; }
        button:disabled { background: #222; color: #555; border-color: #444; }
        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="header">
        <button id="btn-c5" onclick="flash('manifest_c5.json')" disabled>A CARREGAR...</button>
        <button id="btn-std" onclick="flash('manifest_std.json')" disabled>A CARREGAR...</button>
        <button id="btn-bruce" onclick="flash('manifest_bruce.json')" disabled style="color:#f55; border-color:#f55">BRUCE</button>
        <button onclick="location.reload()" style="background:#550000; border-color:#ff0000;">RESET PAGINA</button>
    </div>

    <div id="term"></div>

    <script type="module">
        import * as esptool from 'https://esm.run/esptool-js@0.5.6';
        window.ESPLoader = esptool.ESPLoader;
        window.Transport = esptool.Transport;
        window.libReady = true;
        if (window.term) {
            window.term.writeln('\x1b[1;32m> V32 PRONTA. Lógica "Smart Open" ativa.\x1b[0m');
            enableButtons();
        }
    </script>

    <script>
        const term = new Terminal({ theme: { background: '#0d0d0d', foreground: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V32 ===');

        const check = setInterval(() => {
            if (window.libReady) { clearInterval(check); enableButtons(); }
        }, 500);

        function enableButtons() {
            if(document.getElementById('btn-c5').innerText !== "A CARREGAR...") return;
            document.querySelectorAll('button').forEach(b => {
                if(b.innerText !== "RESET PAGINA") {
                    b.disabled = false;
                    b.innerText = b.innerText.replace("A CARREGAR...", "FLASH");
                }
            });
        }

        async function flash(manifestUrl) {
            const btns = document.querySelectorAll('button');
            btns.forEach(b => { if(b.innerText !== "RESET PAGINA") b.disabled = true; });

            try {
                term.writeln(`\n> [1] Manifesto: ${manifestUrl}...`);
                let manifest;
                try {
                    manifest = await fetch(manifestUrl).then(r => { if(!r.ok) throw new Error(); return r.json(); });
                } catch (e) {
                    manifest = await fetch('/install/' + manifestUrl).then(r => r.json());
                }

                term.writeln('> [2] Porta Serial...');
                
                // --- LÓGICA NOVA V32 ---
                const port = await navigator.serial.requestPort();
                
                // Verificação Inteligente:
                if (port.readable || port.writable) {
                    term.writeln('\x1b[1;33m> Porta detetada como JÁ ABERTA. Reutilizando conexão...\x1b[0m');
                    // Não chamamos port.open()!
                } else {
                    term.writeln('> Porta fechada. A abrir...');
                    try {
                        await port.open({ baudRate: 115200 });
                    } catch (e) {
                        if (e.message.includes("already open")) {
                             term.writeln('\x1b[1;33m> Erro ignorado: O browser mentiu, a porta já estava aberta.\x1b[0m');
                        } else {
                            throw e;
                        }
                    }
                }
                // -----------------------

                term.writeln('> [3] Conectando...');
                const transport = new window.Transport(port);
                const loader = new window.ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => term.clear(),
                        writeLine: (d) => term.writeln(d),
                        write: (d) => term.write(d)
                    }
                });

                let chipName = "DESCONHECIDO";
                try {
                    if (typeof loader.main === "function") chipName = await loader.main();
                    else if (typeof loader.main_fn === "function") chipName = await loader.main_fn();
                    else { await loader.connect(); chipName = "Stub"; }
                } catch (e) {
                    if (e.message.includes("Unknown Chip") || e.message.includes("0x5fd1406f")) {
                        term.writeln('\x1b[1;33m> Chip C5 detetado! Forçando...\x1b[0m');
                        chipName = "ESP32-C5 (Forced)";
                    } else { throw e; }
                }
                
                term.writeln(`> Chip: ${chipName}`);
                
                term.writeln('> [4] A APAGAR FLASH...');
                await loader.erase_flash();

                term.writeln('> [5] A ESCREVER...');
                for (let part of manifest.builds[0].parts) {
                    term.writeln(`  -> ${part.path}...`);
                    let bin;
                    try {
                        bin = await fetch(part.path).then(r => { if(!r.ok) throw new Error(); return r.arrayBuffer(); });
                    } catch(e) {
                        bin = await fetch('/install/' + part.path).then(r => r.arrayBuffer());
                    }

                    await loader.write_flash({
                        fileArray: [{ data: new Uint8Array(bin), address: part.offset }],
                        flash_size: 'keep',
                        erase_all: false,
                        compress: true,
                        reportProgress: (i, w, t) => {} 
                    });
                }

                term.writeln('\n> [SUCESSO] Reinicia o dispositivo!');
                await loader.hard_reset();
                
                // Na V32, tentamos fechar simpaticamente
                try { await port.close(); } catch(e) {}

            } catch (e) {
                term.writeln(`\n\x1b[1;31m> ERRO: ${e.message}\x1b[0m`);
            } finally {
                btns.forEach(b => { if(b.innerText !== "RESET PAGINA") b.disabled = false; });
            }
        }
    </script>
</body>
</html>
