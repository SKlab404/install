<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ MARAUDER + BRUCE FLASH TOOL</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: #000;
            color: #00ff41;
            font-family: 'Orbitron', monospace;
            overflow-y: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-out;
        }
        .intro-text {
            font-family: 'VT323', monospace; font-size: 28px; color: #00ff41;
            letter-spacing: 4px; text-shadow: 0 0 10px #00ff41; margin-bottom: 20px;
        }
        .loader-bar {
            width: 300px; height: 4px; background: #1a1a1a;
            position: relative; overflow: hidden; border-radius: 2px;
        }
        .loader-progress {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41;
            animation: load 3.0s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards;
        }
        .intro-hint {
            color: #444; font-family: 'VT323'; font-size: 14px; margin-top: 15px;
            animation: blink 1s infinite; cursor: pointer;
        }
        .intro-hint:hover { color: #fff; text-shadow: 0 0 10px #fff; }

        .terminal-bar {
            width: 100%; max-width: 800px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff41;
            border-radius: 5px;
            padding: 10px 15px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; box-shadow: 0 0 10px #00ff41;
        }
        .status-text { font-family: 'VT323', monospace; font-size: 20px; color: #00ff41; }
        
        .glitch-text {
            font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 20px;
            text-shadow: 2px 2px #d600ff; text-align: center;
        }

        .video-placeholder {
            width: 100%; max-width: 600px; height: 340px;
            background: #050505;
            border: 2px solid #333; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 30px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        .video-placeholder::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 20px 20px; opacity: 0.3;
        }
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #00ff41; box-shadow: 0 0 10px #00ff41;
            animation: scan 3s linear infinite; opacity: 0.5;
        }
        .placeholder-icon { font-size: 48px; color: #333; margin-bottom: 15px; }
        .placeholder-text {
            font-family: 'Orbitron'; font-size: 24px; color: #fff; letter-spacing: 2px;
            text-shadow: 0 0 5px #fff; z-index: 2;
        }
        .placeholder-sub {
            font-family: 'VT323'; font-size: 18px; color: #00ff41; margin-top: 5px; z-index: 2;
        }

        .control-panel {
            display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 40px;
        }
        esp-web-install-button { display: block !important; }
        
        .custom-btn {
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #00ff41;
            width: 280px; height: 100px;
            cursor: pointer; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            transition: all 0.2s;
        }
        .custom-btn:hover { transform: translateY(-5px); box-shadow: 0 0 25px #00ff41; background: rgba(0, 255, 65, 0.1); }
        .btn-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .btn-desc { font-family: 'VT323'; font-size: 18px; color: #00ff41; }
        .pro-mode { border-color: #d600ff; }
        .pro-mode:hover { box-shadow: 0 0 25px #d600ff; background: rgba(214, 0, 255, 0.1); }
        .pro-mode .btn-desc { color: #d600ff; }

        /* TERMINAL BRUCE */
        #bruceTerminal {
            width: 100%; max-width: 800px; height: 250px;
            background: #000; color: #00ff41; font-family: 'VT323', monospace;
            font-size: 15px; padding: 15px; border: 2px solid #d600ff;
            border-radius: 5px; overflow-y: auto; margin: 20px 0;
            box-shadow: 0 0 20px rgba(214, 0, 255, 0.3);
            white-space: pre-wrap; line-height: 1.4; display: none;
        }

        .instructions {
            color: #666; font-size: 12px; text-align: center; margin-bottom: 20px; font-family: 'Orbitron';
        }
        .social-dock {
            display: flex; gap: 20px;
            background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 50px;
            border: 1px solid #333; backdrop-filter: blur(5px);
        }
        .social-icon { color: #666; font-size: 24px; transition: all 0.3s; }
        .social-icon:hover { color: #fff; transform: scale(1.2); text-shadow: 0 0 10px #fff; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        @media (max-width: 700px) { .glitch-text { font-size: 28px; } .control-panel { gap: 15px; } }
    </style>
</head>
<body>
    <!-- INTRO OVERLAY -->
    <div id="intro-overlay" onclick="startSystem()">
        <div class="intro-text">INITIALIZING SYSTEM...</div>
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <div class="intro-hint">[ CLICK TO START ]</div>
    </div>

    <canvas id="matrix"></canvas>

    <!-- HEADER STATUS -->
    <div class="terminal-bar">
        <span class="status-text">> SYSTEM: ONLINE</span>
        <span class="status-text blink">_</span>
    </div>

    <!-- TITLE -->
    <div class="glitch-text">MARAUDER + BRUCE FLASH TOOL</div>

    <!-- COMING SOON VIDEO PLACEHOLDER -->
    <div class="video-placeholder">
        <div class="scan-line"></div>
        <i class="fas fa-video-slash placeholder-icon"></i>
        <div class="placeholder-text">VIDEO TUTORIAL</div>
        <div class="placeholder-sub">// COMING SOON //</div>
    </div>

    <!-- INSTALL BUTTONS -->
    <div class="control-panel">
        <!-- MAURAUDER STANDARD -->
        <esp-web-install-button manifest="manifest_normal.json">
            <button slot="activate" class="custom-btn" onclick="updateStatus('Launching Marauder Standard...')" onmouseenter="playHoverSound()">
                <span class="btn-title">🕷️ MARAUDER</span>
                <span class="btn-desc">ESP32 STANDARD</span>
            </button>
        </esp-web-install-button>

        <!-- MAURAUDER C5 -->
        <esp-web-install-button manifest="manifest_5g.json">
            <button slot="activate" class="custom-btn pro-mode" onclick="updateStatus('Launching Marauder C5...')" onmouseenter="playHoverSound()">
                <span class="btn-title">🕷️ MARAUDER C5</span>
                <span class="btn-desc">ESP32-C5 RISC-V</span>
            </button>
        </esp-web-install-button>

        <!-- BRUCE SMOOCHIE (CUSTOM WEB SERIAL) -->
        <div class="custom-btn pro-mode" onclick="flashBruceSmoochie()" onmouseenter="playHoverSound()">
            <span class="btn-title">🔥 BRUCE</span>
            <span class="btn-desc">SMOOCHIE (4 FICHEIROS)</span>
        </div>
    </div>

    <!-- TERMINAL BRUCE -->
    <div id="bruceTerminal"></div>

    <!-- INSTRUCTIONS -->
    <div class="instructions">
        ⚠️ CONNECT VIA USB UART. HOLD <strong>BOOT</strong> IF STUCK.
    </div>

    <!-- SOCIAL -->
    <div class="social-dock">
        <a href="#" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank" class="social-icon"><i class="fab fa-discord"></i></a>
    </div>

    <script>
        // MATRIX EFFECT
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = '01XYZABC'; const fontSize = 14; const columns = canvas.width/fontSize; const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#0F0'; ctx.font = fontSize+'px monospace';
            for(let i=0; i<drops.length; i++) {
                const text = chars[Math.floor(Math.random()*chars.length)]; ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i]=0; drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // AUDIO SYSTEM (HOVER & CLICK FX)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playHoverSound() {
            if(audioCtx.state==='suspended') audioCtx.resume();
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(800, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime+0.05);
            g.gain.setValueAtTime(0.02, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.05);
            o.start(); o.stop(audioCtx.currentTime+0.05);
        }

        function updateStatus(msg) {
            document.querySelector('.status-text').innerText = '> SYSTEM: ' + msg;
            if(audioCtx.state==='suspended') audioCtx.resume();
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
            o.type='square'; o.frequency.setValueAtTime(200, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime+0.2);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2);
            o.start(); o.stop(audioCtx.currentTime+0.2);
        }

        function playIntroMusic() {
            const audio = new Audio('intro.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio play failed"));
        }

        let systemStarted = false;
        function startSystem() {
            if(systemStarted) return;
            systemStarted = true;
            
            playIntroMusic();
            
            const intro = document.getElementById('intro-overlay');
            setTimeout(() => {
                intro.style.opacity = '0';
                setTimeout(() => { intro.style.display = 'none'; }, 1000);
            }, 300);
        }

        // ========== BRUCE SMOOCHIE WEB SERIAL FLASHER ==========
        let brucePort;
        const bruceTerminal = document.getElementById('bruceTerminal');

        function logBruce(msg) {
            const time = new Date().toLocaleTimeString();
            bruceTerminal.innerHTML += `[${time}] ${msg}\n`;
            bruceTerminal.scrollTop = bruceTerminal.scrollHeight;
        }

        async function flashBruceSmoochie() {
            bruceTerminal.style.display = 'block';
            bruceTerminal.innerHTML = '';
            logBruce('🔥 BRUCE SMOOCHIE INSTALLER');
            logBruce('─────────────────────────');

            try {
                logBruce('🔌 A pedir permissão USB...');
                brucePort = await navigator.serial.requestPort();
                await brucePort.open({ baudRate: 115200 });
                
                logBruce('✅ Dispositivo conectado!');
                logBruce(`📡 Chip: ESP32-S3 (Smoochie)`);

                // ESCUTAR SERIAL (Terminal Live)
                const reader = brucePort.readable.getReader();
                (async () => {
                    try {
                        while(true) {
                            const {value, done} = await reader.read();
                            if(done) break;
                            const text = new TextDecoder().decode(value);
                            if(text.trim()) logBruce(`ESP32: ${text.trim()}`);
                        }
                    } catch(e) {}
                })();

                // FLASH 4 FICHEIROS
                const files = [
                    'bruce/bootloader.bin',
                    'bruce/partitions.bin',
                    'bruce/firmware.bin',
                    'bruce/reaper.bin'
                ];

                const writer = brucePort.writable.getWriter();

                for(let i = 0; i < files.length; i++) {
                    const file = files[i];
                    logBruce(`📥 [${i+1}/4] Baixando ${file}...`);
                    
                    const response = await fetch(file);
                    if(!response.ok) throw new Error(`Erro ao baixar ${file}`);
                    
                    const buffer = await response.arrayBuffer();
                    const sizeKB = (buffer.byteLength / 1024).toFixed(1);
                    logBruce(`📦 Tamanho: ${sizeKB} KB`);
                    
                    logBruce(`⚡ A flashar... NÃO DESLIGUE!`);
                    await writer.write(new Uint8Array(buffer));
                    
                    logBruce(`✅ ${file} flashado com sucesso!`);
                    logBruce('─────────────────────────');
                }

                writer.releaseLock();
                
                logBruce('🎉 BRUCE SMOOCHIE INSTALADO!');
                logBruce('🔄 Reiniciando dispositivo...');
                updateStatus('Bruce Smoochie: INSTALLED');

            } catch(e) {
                logBruce(`❌ ERRO: ${e.message}`);
                logBruce('⚠️ Verifica se escolheste o dispositivo correto.');
            }
        }
    </script>
</body>
</html>
