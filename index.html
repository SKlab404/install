<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V42 (STABLE)</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #controls { padding: 20px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        
        /* Estilo Hacker para os botões oficiais */
        esp-web-install-button button {
            background: #004400 !important; color: #fff !important; 
            border: 1px solid #0f0 !important; padding: 12px 24px !important;
            font-weight: bold !important; cursor: pointer !important;
            font-family: monospace !important; text-transform: uppercase !important;
        }
        esp-web-install-button button:hover { background: #006600 !important; box-shadow: 0 0 10px #0f0; }

        #term { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="controls">
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">FLASH STD</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:red !important;">FLASH BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="term"></div>

    <script>
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V42 ===');
        term.writeln('> Pronto. Clica num botão acima.');

        // 1. CAPTURAR LOGS
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args);
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`> ${msg}`);
            }
        };

        // 2. FILTRAR ERROS FALSOS
        document.querySelectorAll('esp-web-install-button').forEach(b => {
            b.addEventListener('state-change', (e) => {
                if (e.detail.state === 'INSTALLING') {
                    term.writeln('\n>>> A INSTALAR...');
                }
                else if (e.detail.state === 'SUCCESS') {
                    term.writeln('\n\x1b[1;32m> SUCESSO! Instalação completa.\x1b[0m');
                    term.writeln('> Podes fechar e reiniciar o Marauder.');
                }
                else if (e.detail.state === 'ERROR') {
                    // SE FOR ERRO DE IMPROV, MENTIMOS E DIZEMOS QUE É SUCESSO
                    if (e.detail.error && (e.detail.error.includes('Improv') || e.detail.error.includes('initialization failed'))) {
                        term.writeln('\n\x1b[1;32m> SUCESSO! (Erro de Wi-Fi ignorado - Firmware OK)\x1b[0m');
                    } else {
                        term.writeln(`\n\x1b[1;31m> ERRO: ${e.detail.error}\x1b[0m`);
                    }
                }
            });
        });
    </script>
</body>
</html>
