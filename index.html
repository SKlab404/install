<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MARAUDER V34 (HYBRID)</title>
    
    <!-- 1. Motor Oficial (Infalível) -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <!-- 2. Terminal Visual -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { padding: 20px; background: #111; border-bottom: 1px solid #333; text-align: center; }
        
        /* Esconder o botão feio original e criar os nossos */
        esp-web-install-button { display: inline-block; margin: 0 10px; }
        
        /* Estilo dos botões "Cyberpunk" */
        button[slot="activate"] {
            padding: 15px 25px; 
            background: #003300; color: #fff; 
            border: 1px solid #0f0; 
            cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase;
            font-size: 14px;
        }
        button[slot="activate"]:hover { background: #005500; box-shadow: 0 0 10px #0f0; }
        
        #term { flex: 1; padding: 10px; position: relative; }
        
        /* Truque para esconder o popup oficial mas manter a funcionalidade (Opcional, remove se quiseres ver o popup) */
        /* body.flashing .ewt-dialog { opacity: 0; pointer-events: none; } */
    </style>
</head>
<body>

    <div id="header">
        <!-- BOTÃO C5 -->
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">FLASH C5</button>
        </esp-web-install-button>

        <!-- BOTÃO STD -->
        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">FLASH STD</button>
        </esp-web-install-button>

        <!-- BOTÃO BRUCE -->
        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate" style="border-color:#f00; color:#f55;">FLASH BRUCE</button>
        </esp-web-install-button>
    </div>

    <div id="term"></div>

    <script>
        // Configurar Terminal
        const term = new Terminal({ theme: { background: '#000', foreground: '#0f0' }, cursorBlink: true, fontSize: 14 });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        term.writeln('=== MARAUDER V34 (MOTOR OFICIAL) ===');
        term.writeln('> Sistema pronto.');
        term.writeln('> Clica nos botões acima para iniciar.');

        // O TRUQUE DE MESTRE:
        // Vamos "roubar" os logs da consola do browser e metê-los no terminal verde.
        const originalLog = console.log;
        const originalInfo = console.info;
        const originalWarn = console.warn;
        const originalError = console.error;

        function writeToTerm(msg, type) {
            // Filtra mensagens chatas, mantém as do esptool
            if (typeof msg === 'string') {
                if (msg.includes('%') || msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Chip')) {
                    term.writeln(msg);
                }
            }
            // Se for objeto, tenta converter
            else if (typeof msg === 'object') {
                try { term.writeln(JSON.stringify(msg)); } catch(e){}
            }
        }

        console.log = function(...args) {
            originalLog(...args);
            writeToTerm(args[0], 'log');
        };
        console.info = function(...args) {
            originalInfo(...args);
            writeToTerm(args[0], 'info');
        };
    </script>
</body>
</html>
