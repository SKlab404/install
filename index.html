<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SKLAB INSTALLER V45</title>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
    <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #00ff41; 
            font-family: 'Orbitron', monospace; 
            display: flex; flex-direction: column; 
            height: 100vh;
        }

        #header { 
            padding: 25px; 
            text-align: center; 
            background: linear-gradient(90deg, #001100, #002200, #001100);
            border-bottom: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0,255,65,0.3);
        }
        
        h1 { 
            font-size: 2em; 
            margin: 0; 
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ff41;
        }

        #controls { 
            padding: 30px; 
            text-align: center; 
            background: rgba(0,15,0,0.9);
            border-bottom: 1px solid #003300;
        }
        
        esp-web-install-button { margin: 0 12px; display: inline-block; }
        esp-web-install-button button {
            background: linear-gradient(45deg, #004400, #00aa00) !important; 
            color: #fff !important; 
            border: 2px solid #00ff41 !important; 
            padding: 15px 30px !important;
            font-size: 1.1em; font-weight: 700 !important; 
            cursor: pointer !important;
            font-family: 'Orbitron', monospace !important; 
            text-transform: uppercase !important;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,255,65,0.4);
            transition: all 0.3s ease;
            min-width: 140px;
        }
        esp-web-install-button button:hover { 
            background: linear-gradient(45deg, #00aa00, #00ff41) !important;
            box-shadow: 0 0 25px #00ff41;
            transform: translateY(-2px);
        }

        #term { 
            flex: 1; padding: 20px; 
            background: rgba(0,0,0,0.95);
            border-top: 1px solid #00ff41;
        }

        .status-ok { color: #00ff41 !important; }
        .status-error { color: #ff4444 !important; }
    </style>
</head>
<body>

    <div id="header">
        <h1>SKLAB404 INSTALLER</h1>
        <div style="font-size: 0.9em; opacity: 0.8;">V45 - MULTI-TARGET</div>
    </div>

    <div id="controls">
        <!-- ADICIONA AQUI OS TEUS MANIFESTOS -->
        <esp-web-install-button manifest="manifest_c5.json">
            <button slot="activate">🧠 C5 Target</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_std.json">
            <button slot="activate">⚡ STD Target</button>
        </esp-web-install-button>

        <esp-web-install-button manifest="manifest_bruce.json">
            <button slot="activate">🔥 BRUCE Target</button>
        </esp-web-install-button>

        <!-- Exemplo de como adicionar mais: -->
        <!-- <esp-web-install-button manifest="outro-manifest.json">
            <button slot="activate">🚀 OUTRO Target</button>
        </esp-web-install-button> -->
    </div>

    <div id="term"></div>

    <script>
        // TUA INTRO MP3 (link raw do GitHub)
        const introMusic = new Audio("https://github.com/SKlab404/install/raw/Lab4041/UnattendedWinstall/intro.mp3");
        introMusic.volume = 0.7;
        introMusic.loop = false;
        introMusic.play().catch(e => console.log('Audio bloqueado pelo browser'));

        // TERMINAL
        const term = new Terminal({ 
            theme: { 
                background: 'rgba(0,0,0,0.9)', 
                foreground: '#00ff41',
                cursor: '#00ff41'
            }, 
            cursorBlink: true,
            fontFamily: 'Orbitron, monospace'
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('term'));
        fit.fit();
        window.onresize = () => fit.fit();

        // BOOT MESSAGE
        term.writeln('\n\x1b[1;32m[SYSTEM] SKLAB404 INSTALLER V45 ONLINE\x1b[0m');
        term.writeln('\x1b[1;33m[READY] Seleciona target acima...\x1b[0m\n');

        // CAPTURA DE LOGS (progresso)
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog(...args);
            const msg = args.join(' ');
            if (msg.includes('Writing') || msg.includes('Erasing') || msg.includes('Connected') || msg.includes('%')) {
                term.writeln(`\x1b[1;36mLOG: ${msg}\x1b[0m`);
            }
        };

        // EVENTOS DOS BOTÕES (SUCESSO/ERRO sempre visível)
        document.querySelectorAll('esp-web-install-button').forEach((button, index) => {
            button.addEventListener('state-change', (e) => {
                const targetName = button.querySelector('button').textContent.trim();
                
                if (e.detail.state === 'INSTALLING') {
                    term.writeln(`\n\x1b[1;35m>>> ${targetName} - DOWNLOAD INICIADO...\x1b[0m`);
                }
                else if (e.detail.state === 'SUCCESS') {
                    term.writeln(`\n\x1b[1;32m✓ SUCESSO! ${targetName} instalado correctamente.\x1b[0m`);
                    term.writeln('\x1b[0;33m> Desconecta → Reconecta o dispositivo para testar.\x1b[0m\n');
                }
                else if (e.detail.state === 'ERROR') {
                    if (e.detail.error && (e.detail.error.includes('Improv') || e.detail.error.includes('initialization failed'))) {
                        term.writeln(`\n\x1b[1;32m✓ SUCESSO! ${targetName} OK (erro Wi-Fi ignorado).\x1b[0m\n`);
                    } else if (e.detail.error && e.detail.error.includes('already open')) {
                        term.writeln(`\n\x1b[1;33m⚠ PORTA OCUPADA (${targetName})\x1b[0m`);
                        term.writeln('\x1b[0;37m> 1. Desconecta cabo USB\n> 2. Fecha abas\n> 3. Reconecta e tenta de novo\x1b[0m\n');
                    } else {
                        term.writeln(`\n\x1b[1;31m✗ FALHOU: ${targetName}\n  ${e.detail.error}\x1b[0m\n`);
                    }
                }
            });
        });
    </script>
</body>
</html>
