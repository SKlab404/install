<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Terminal</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#000;
    font-family:monospace;
    overflow:hidden;
    color:#00ff88;
}

/* SPLASH */
#splash{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    cursor:pointer;
    z-index:10;
    transition:0.6s;
}
#splash.fade{
    opacity:0;
    pointer-events:none;
}
#splash h1{
    font-size:3.5em;
    letter-spacing:4px;
    text-shadow:0 0 20px #00ff88;
}

/* TERMINAL */
#term{
    position:fixed;
    width:100%;
    height:100%;
}

/* BOTÃO */
#flashArea{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    z-index:1000;
}

.cyberBtn{
    background:#001a12 !important;
    color:#00ff88 !important;
    border:2px solid #00ff88 !important;
    padding:14px 35px !important;
    font-size:15px !important;
    cursor:pointer !important;
    letter-spacing:2px;
}
.cyberBtn:hover{
    background:#002b1f !important;
}
</style>
</head>
<body>

<div id="splash" onclick="enter()">
    <h1>SKLAB404</h1>
    <p>Click to initialize terminal</p>
</div>

<div id="term"></div>

<div id="flashArea">
    <esp-web-install-button manifest="manifest_c5.json">
        <button slot="activate" class="cyberBtn">
            AUTHORIZE FLASH
        </button>
    </esp-web-install-button>
</div>

<script>

const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ff88',
        cursor:'#00ff88'
    },
    fontFamily:'Courier New, monospace',
    fontSize:14,
    cursorBlink:true
});

const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
window.addEventListener('resize',()=>fit.fit());

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function type(text, delay=35){
    for(let i=0;i<text.length;i++){
        term.write(text[i]);
        await sleep(delay);
    }
    term.write("\r\n");
}

function enter(){

    document.getElementById("splash").classList.add("fade");

    // INTRO MUSIC (confirma que é RAW link válido)
    const intro = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    intro.volume = 0.5;
    intro.play().catch(()=>{});

    setTimeout(startSequence,600);
}

async function startSequence(){

    await type("Booting secure environment...");
    await sleep(400);

    await type("Loading system modules...");
    await sleep(400);

    await type("Establishing encrypted channel...");
    await sleep(400);

    term.write("\r\n");
    await type("Are you there?");
    await sleep(800);

    await type("Connection established.");
    term.write("\r\n");

    term.writeln("\x1b[1;33mAuthorization required.\x1b[0m");

    document.getElementById("flashArea").style.display="block";
}

/* CAPTURA LOGS REAIS + MODELO DO CHIP */
const originalConsoleLog = console.log;

console.log = function (...args) {
    const msg = args.join(" ");

    // progresso real
    if (
        msg.includes("Writing") ||
        msg.includes("%") ||
        msg.includes("Erasing")
    ) {
        term.writeln("> " + msg);
    }

    // modelo do chip
    if (
        msg.includes("Chip is") ||
        msg.includes("Detecting chip type") ||
        msg.includes("ESP32") ||
        msg.includes("ESP8266")
    ) {
        term.writeln("\x1b[1;36m[DEVICE] " + msg + "\x1b[0m");
    }

    originalConsoleLog.apply(console, args);
};

/* ESTADOS */
document.querySelector("esp-web-install-button")
.addEventListener("state-change",(e)=>{
    if(e.detail.state==="INSTALLING"){
        term.writeln("> Flashing firmware...");
    }
    if(e.detail.state==="SUCCESS"){
        term.writeln("\x1b[1;32m✓ Flash complete\x1b[0m");
    }
    if(e.detail.state==="ERROR"){
        term.writeln("\x1b[1;31m✗ " + e.detail.error + "\x1b[0m");
    }
});

</script>

</body>
</html>
