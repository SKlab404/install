<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SKLAB404 Flasher</title>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

<link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css"/>
<script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>

<style>
body{
    margin:0;
    background:#0b0f14;
    color:#00ffc8;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* INTRO */
#intro{
    position:fixed;
    inset:0;
    background:#0b0f14;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    cursor:pointer;
    transition:0.5s;
}
#intro.fade{
    opacity:0;
    pointer-events:none;
}

/* MAIN */
#card{
    border:1px solid #00ffc833;
    padding:50px;
    text-align:center;
    background:#111821;
}

button{
    padding:12px 25px;
    border:1px solid #00ffc8;
    background:transparent;
    color:#00ffc8;
    cursor:pointer;
    transition:0.2s;
}
button:hover{
    background:#002822;
}

/* OVERLAY TERMINAL */
#overlay{
    position:fixed;
    inset:0;
    background:#000000f0;
    display:none;
    flex-direction:column;
    padding:30px;
}

#progressContainer{
    height:8px;
    background:#111;
    margin-bottom:10px;
    display:none;
}
#progressBar{
    height:100%;
    width:0%;
    background:#00ffc8;
    transition:0.2s;
}

#percent{
    font-size:12px;
    margin-bottom:5px;
    opacity:0.7;
}

#term{
    flex:1;
    border:1px solid #00ffc833;
}

#closeBtn{
    margin-top:15px;
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro" onclick="enterSite()">
    <h1>SKLAB404</h1>
    <p>Click to initialize installer</p>
</div>

<!-- MAIN -->
<div id="card">
    <h2>Firmware Installer</h2>
    <button onclick="startFlash()">Install Firmware</button>
</div>

<!-- Hidden esp tool -->
<esp-web-install-button id="hiddenFlash" manifest="manifest_c5.json" style="display:none;"></esp-web-install-button>

<!-- TERMINAL OVERLAY -->
<div id="overlay">
    <div id="percent"></div>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
    <div id="term"></div>
    <button id="closeBtn" onclick="closeOverlay()">Close</button>
</div>

<script>

/* INTRO */
function enterSite(){
    const introAudio = new Audio("https://raw.githubusercontent.com/SKlab404/install/Lab4041/UnattendedWinstall/intro.mp3");
    introAudio.volume = 0.5;
    introAudio.play().catch(()=>{});
    document.getElementById("intro").classList.add("fade");
}

/* TERMINAL */
const term = new Terminal({
    theme:{
        background:'#000000',
        foreground:'#00ffc8',
        cursor:'#00ffc8'
    },
    fontSize:14,
    cursorBlink:true
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById("term"));

function startFlash(){
    document.getElementById("overlay").style.display="flex";
    fit.fit();
    term.clear();
    term.writeln("Initializing flashing process...\n");

    document.getElementById("hiddenFlash")
        .shadowRoot
        .querySelector("button")
        .click();
}

function closeOverlay(){
    document.getElementById("overlay").style.display="none";
}

/* LOG CAPTURE */
const originalConsoleLog = console.log;

console.log = function(...args){

    const msg = args.join(" ");

    if(msg.includes("ESP32")){
        term.writeln("\n[DEVICE] " + msg);
    }

    if(msg.includes("Writing") || msg.includes("%") || msg.includes("Erasing")){
        term.writeln("> " + msg);

        const match = msg.match(/(\d+)%/);
        if(match){
            document.getElementById("progressContainer").style.display="block";
            document.getElementById("progressBar").style.width = match[1] + "%";
            document.getElementById("percent").innerText = match[1] + "%";
        }
    }

    if(msg.includes("Hash of data verified") || msg.includes("Leaving...")){
        term.writeln("\n✓ FLASH COMPLETE");
        document.getElementById("percent").innerText = "FLASH COMPLETE";
    }

    originalConsoleLog.apply(console,args);
};

</script>

</body>
</html>
